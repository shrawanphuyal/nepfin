  if(t==='v'){let vs=VERBS;if(k==='kpt')vs=VERBS.filter(isKpt);else if(k==='4')vs=VERBS.filter(v=>v.t>=4);else if(k!=='all')vs=VERBS.filter(v=>v.t===+k);return vs.map(verbCard)}
  if(t==='q')return QUESTIONS.map(qCard);
  if(t==='c')return CASES.map(caseCard);
  if(t==='s')return SUFFIXES.map(sufCard);
  if(t==='p')return PHRASES[k]?PHRASES[k].items.map(pCard):[];
  if(t==='pt')return THREE.map(r=>({id:'pt|'+r[0],e:'🧱',fi:r[0],en:r[4],ne:r[5],back:`<div class="forms3"><div><span class="mut">genitive</span><b>${r[1]}</b></div><div><span class="mut">partitive</span><b>${r[2]}</b></div><div><span class="mut">illative</span><b>${r[3]}</b></div></div>`,say2:r[0]+', '+r[1]+', '+r[2],ask:'Say: genitive, partitive, illative'}));
  if(t==='pp')return POSTPOS.map(p=>({id:'pp|'+p[1],e:p[0],fi:p[1],en:p[2],ne:p[3],xf:p[4],xe:p[5]}));
  if(t==='pa')return VERBS.filter(v=>PAST[v.fi]).map(v=>{const p=PAST[v.fi];return {id:'pa|'+v.fi,e:v.e,fi:v.fi,en:v.en,ne:v.ne,back:`<div class="forms3"><div><span class="mut">minä</span><b>${p[0]}</b></div><div><span class="mut">hän</span><b>${p[1]}</b></div><div><span class="mut">en …</span><b>${p[2]}</b></div></div>`,say2:'minä '+p[0]+', hän '+p[1]+', en '+p[2],ask:'Say the past: minä …, hän …, en …'}});
  if(t==='sp')return PUHE_SENT.map(s=>({id:'sp|'+s[0],e:'🗣️',fi:s[0],en:s[2],ne:s[3],sp:s[1],ask:'How do people say it?'}));
  if(t==='im')return IMPER.map(r=>({id:'im|'+r[0],e:'👉',fi:r[1],en:r[4],ne:r[5],note:'Negative: '+r[2]+' · Polite plural: '+r[3]}));

const ONES=['nolla','yksi','kaksi','kolme','neljä','viisi','kuusi','seitsemän','kahdeksan','yhdeksän'];
const SP1=['nolla','yks','kaks','kolme','neljä','viis','kuus','seittemän','kaheksan','yheksän'];
const SPT={2:'kakskyt',3:'kolkyt',4:'nelkyt',5:'viiskyt',6:'kuuskyt',7:'seitkyt',8:'kasikyt',9:'ysikyt'};
function numFi(n){n=+n;if(n<10)return ONES[n];if(n===10)return 'kymmenen';if(n<20)return ONES[n-10]+'toista';
  if(n<100){const t=Math.floor(n/10),u=n%10;return ONES[t]+'kymmentä'+(u?ONES[u]:'')}
  if(n<1000){const h=Math.floor(n/100),r=n%100;return (h===1?'sata':ONES[h]+'sataa')+(r?numFi(r):'')}
  if(n<10000){const t=Math.floor(n/1000),r=n%1000;return (t===1?'tuhat':ONES[t]+'tuhatta')+(r?numFi(r):'')}return String(n)}
function numSp(n){n=+n;if(n<10)return SP1[n];if(n===10)return 'kymmenen';if(n<20)return SP1[n-10]+'toist';
  if(n<100){const t=Math.floor(n/10),u=n%10;return SPT[t]+(u?SP1[u]:'')}
  if(n<1000){const h=Math.floor(n/100),r=n%100;return (h===1?'sata':SP1[h]+'sataa')+(r?numSp(r):'')}
  if(n<10000){const t=Math.floor(n/1000),r=n%1000;return (t===1?'tuhat':SP1[t]+'tuhatta')+(r?numSp(r):'')}return String(n)}
const ORD1=['','ensimmäinen','toinen','kolmas','neljäs','viides','kuudes','seitsemäs','kahdeksas','yhdeksäs','kymmenes','yhdestoista','kahdestoista','kolmastoista','neljästoista','viidestoista','kuudestoista','seitsemästoista','kahdeksastoista','yhdeksästoista','kahdeskymmenes'];

const HLTA=['','yhdeltä','kahdelta','kolmelta','neljältä','viideltä','kuudelta','seitsemältä','kahdeksalta','yhdeksältä','kymmeneltä','yhdeltätoista','kahdeltatoista'];

const VAILLE={5:'viittä',10:'kymmentä',15:'varttia',20:'kahtakymmentä',25:'kahtakymmentäviittä'};
const YLI_SP={5:'viis',10:'kymmenen',15:'varttii',20:'kakskyt',25:'kakskytviis'};
const VAILLE_SP={5:'viittä',10:'kymmentä',15:'varttii',20:'kahtakymmentä',25:'kahtakymmentäviittä'};
function clockFi(h24,m){const h=h24%12||12,nx=h%12+1;let w,sp,lta;
  if(m===0){w='kello '+numFi(h);sp='kello '+numSp(h);lta=HLTA[h]}
  else if(m===30){w='puoli '+numFi(nx);sp='puol '+numSp(nx);lta='puoli '+HLTA[nx]}

  const dig=numFi(h24)+(m?' '+(m<10?'nolla '+numFi(m):numFi(m)):'');
  return {w,sp,lta,dig,txt:String(h24).padStart(2,'0')+':'+String(m).padStart(2,'0')}}

  ${H3('kpt','KPT: strong and weak consonants','ess')}

// ================= QUESTIONS LAB =================
const koKo=w=>/[aou]/i.test(w)?'ko':'kö';
const FLIPI=[1,0,2,4,3,5];
const QB={v:Math.max(0,VERBS.findIndex(v=>v.fi==='puhua')),p:1};
function renderQB(){
  const v=VERBS[QB.v],i=QB.p,j=FLIPI[i];const f=v.f[i];const q=cap(f)+koKo(f);
  const pr=PRON[i][0];const ans=v.f[j],no=NEG[j]+' '+v.f[0].slice(0,-1);
  const spv=SPOKEN_VERBS[v.fi];let sp='';
  if(spv&&i===1){const w=spv[1].split(' ')[1];sp=cap(w)+'sä?'}else if(spv&&i===2){const w=spv[2].split(' ')[1];sp=cap(w)+'ks se?'}
  $$('#qbP [data-p]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.p===i)));
  $('#qbOut').innerHTML=`<div class="eyebrow">${pr} + ${esc(v.fi)} + -${koKo(f)}</div>
   <div class="row"><div class="res">${hlEnd(f,i).replace(/^./,m=>m.toUpperCase())}<span class="hl">${koKo(f)}</span> ${i!==2&&i!==5?'('+pr+')':pr}?</div>${spk(q+' '+pr+'?')}</div>
   ${sp?`<div class="lsp t-sp">🗣 ${sp}</div>`:''}
   <div class="t-en mut">${['Do I','Do you','Does he / she','Do we','Do you (all)','Do they'][i]} ${v.en.replace(/^to /,'')}?</div>
   <div class="grid" style="margin-top:12px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))">
    <div class="card k-soft-out"><div class="eyebrow">Yes</div><div class="row" style="gap:6px"><b class="fi">${cap(ans)}.</b>${spk(cap(ans))}</div><div class="mut" style="font-size:.85rem">or: Kyllä / Joo, ${PRON[j][0]} ${ans}.</div></div>
    <div class="card k-soft-ne"><div class="eyebrow">No</div><div class="row" style="gap:6px"><b class="fi">${cap(no)}.</b>${spk(cap(no))}</div><div class="mut" style="font-size:.85rem">or: Ei, ${PRON[j][0]} ${no}.</div></div></div>
   <p class="mut" style="font-size:.88rem;margin:10px 0 0">The answer flips the person: you ask with <b>${pr}</b>, the answer uses <b>${PRON[j][0]}</b>.</p>`;
}
let QA={i:0};
function renderQA(){const r=QA_BANK[QA.i];const key='qa:'+QA.i;
  $('#qaBox').innerHTML=`<div class="mut mono" style="font-size:.78rem">Question ${QA.i+1} of ${QA_BANK.length}</div>
  <div class="row" style="margin:6px 0"><div class="qprompt" style="margin:0">${esc(r[0])}</div>${spk(r[0])}</div>
  <div class="t-en mut">${esc(r[1])}</div><div class="ne t-ne">${esc(r[2])}</div>
  <label class="grp-label" for="qaIn">Your answer (say it aloud first, then write it)</label>
  <textarea id="qaIn" rows="2" placeholder="Kirjoita vastaus…">${esc(sget(key,''))}</textarea>${fiKeys('qaIn')}
  <div class="row" style="margin-top:8px"><button class="btn ghost sm" id="qaPrev">← Previous</button><button class="btn pri sm" id="qaShow">Show a model answer</button><button class="btn ghost sm" id="qaNext">Next →</button><button class="btn ghost sm" id="qaRnd">Random</button></div><div id="qaModel"></div>`;
  $('#qaIn').addEventListener('input',e=>sset(key,e.target.value));
  $('#qaPrev').onclick=()=>{QA.i=(QA.i+QA_BANK.length-1)%QA_BANK.length;renderQA()};$('#qaNext').onclick=()=>{QA.i=(QA.i+1)%QA_BANK.length;renderQA();sayNow(QA_BANK[QA.i][0])};
  $('#qaRnd').onclick=()=>{QA.i=rnd(0,QA_BANK.length-1);renderQA();sayNow(QA_BANK[QA.i][0])};
  $('#qaShow').onclick=()=>{$('#qaModel').innerHTML=`<div class="note ok" style="margin-top:10px">${lineHTML(r[3],r[4])}<p class="mut" style="font-size:.88rem;margin:6px 0 0">Change it to be true for you. Then say it three times.</p></div>`;sayNow(r[3]);countActivity()};
}

  const grp=g=>`<div class="qgroup k-soft-${g.key}" id="q-${g.id}"><div class="row" style="gap:10px"><span style="font-size:1.8rem">${g.icon}</span><div><h4 style="margin:0;font-size:1.2rem">${g.en} <span class="ne">· ${g.ne}</span></h4><p class="mut" style="margin:2px 0 0;font-size:.92rem">${esc(g.logic)}</p></div></div>
   <div class="grid wide" style="margin-top:10px">${g.items.map(it=>`<div class="card"><div class="row" style="justify-content:space-between;gap:6px"><div class="row" style="gap:6px"><b class="fi" style="font-size:1.15rem">${esc(it[0])}</b>${spk(it[0])}</div>${tag('→ '+esc(it[3]),g.key)}</div><div><span class="t-en">${esc(it[1])}</span> · <span class="ne t-ne">${esc(it[2])}</span></div>
   <div class="stack" style="gap:8px;margin-top:8px">${it[4].map(e=>`<div class="qa"><div class="row" style="gap:6px;flex-wrap:nowrap">${spk(e[0])}<span class="fi">${esc(e[0])}</span></div><div class="row" style="gap:6px;flex-wrap:nowrap;padding-left:2px">${spk(e[1])}<span>– ${esc(e[1])}</span></div><div class="t-en mut" style="font-size:.85rem">${esc(e[2])}</div><div class="ne t-ne" style="font-size:.85rem">${esc(e[3])}</div></div>`).join('')}</div>
   ${it[5]?`<p class="mut" style="font-size:.85rem;margin:8px 0 0">${esc(it[5])}</p>`:''}</div>`).join('')}</div></div>`;
  $('#p-questions').innerHTML=`<p class="eyebrow">Kysymykset · Questions lab</p><h2>How Finnish questions are built, and how to answer them</h2>
  <p class="lede">There are only two kinds of question. Learn the logic once and you can ask anything: <b>(1)</b> yes / no questions with <b>-ko / -kö</b> on the verb, and <b>(2)</b> question-word questions that start with <b>K-</b> or <b>M-</b>.</p>
  ${jumpNav([['two','2 kinds'],['yesno','-ko / -kö'],['qbuild','Question builder'],['flip','Answering'],['negq','Etkö?'],['polite','Polite'],['groups','Question words'],['confuse','How vs when vs what kind'],['qa','Speaking: 30 questions']])}
  ${H3('two','Two kinds of question','in')}
  <div class="grid wide">
   <div class="card k-soft-in"><div class="eyebrow">Kind 1 · yes / no</div><h4>Verb first + -ko / -kö</h4>${lineHTML('Puhutko suomea?','Do you speak Finnish?','तिमी फिनिस बोल्छौ?','Puhutsä suomee?')}${lineHTML('Onko täällä vessa?','Is there a toilet here?','यहाँ शौचालय छ?','Onks täällä vessaa?')}<p class="mut" style="font-size:.9rem;margin:6px 0 0">Nepali puts <b>के</b> at the start. Finnish glues <b>-ko</b> to the verb.</p></div>
   <div class="card k-soft-ess"><div class="eyebrow">Kind 2 · question word</div><h4>K- or M- word first, normal order, no -ko</h4>${lineHTML('Missä asut?','Where do you live?','कहाँ बस्छौ?','Mis sä asut?')}${lineHTML('Milloin tulet?','When are you coming?','कहिले आउँछौ?','Koska sä tuut?')}<p class="mut" style="font-size:.9rem;margin:6px 0 0">Nepali question words start with <b>क</b> (को, के, कहाँ). Finnish ones start with <b>K</b> or <b>M</b>.</p></div>

     .map(r=>`<tr><td>${tag(r[0],r[0]==='how'?'out':r[0]==='when'?'ess':'par')}</td><td><b class="fi">${r[1]}</b></td><td>${r[2]}</td><td class="mut">${r[3]}</td><td class="fi">${r[4]}</td></tr>`).join('')}</tbody></table></div>

// ================= LINE PLAYER (listen / shadow / my role) =================
const PL={on:false,i:0,nodes:[],mode:'listen',role:'B',btn:null};
function stopPlayer(){if(!PL.on)return;PL.on=false;hush();$$('.ln.speaking,.ln.yourturn').forEach(l=>l.classList.remove('speaking','yourturn'));if(PL.btn)PL.btn.textContent=PL.btn.dataset.label;PL.btn=null}
function startPlayer(nodes,mode,btn){if(PL.on){const same=PL.btn===btn;stopPlayer();if(same)return}
  if(!nodes.length)return;PL.on=true;PL.i=0;PL.nodes=nodes;PL.mode=mode;PL.btn=btn;if(btn){btn.dataset.label=btn.dataset.label||btn.textContent;btn.textContent='■ Stop'}hush();setTimeout(plStep,120)}
function plStep(){if(!PL.on)return;$$('.ln.speaking,.ln.yourturn').forEach(l=>l.classList.remove('speaking','yourturn'));
  if(PL.i>=PL.nodes.length){stopPlayer();markDay();return}
  const ln=PL.nodes[PL.i],fi=ln.dataset.fi,words=fi.split(/\s+/).length;
  try{ln.scrollIntoView({block:'center',behavior:reduceMotion()?'auto':'smooth'})}catch(e){}
  const next=d=>setTimeout(()=>{PL.i++;plStep()},d);
  if(PL.mode==='role'&&ln.dataset.role===PL.role){ln.classList.add('yourturn');
    setTimeout(()=>{if(!PL.on)return;ln.classList.remove('yourturn');ln.classList.add('speaking','rev');say(fi,()=>next(500))},1400+words*750);return}
  ln.classList.add('speaking');
  say(fi,()=>{if(PL.mode==='shadow'){ln.classList.remove('speaking');ln.classList.add('yourturn');next(1200+words*650)}else next(450)});
}
function lnHTML(fi,en,ne,sp,who,role,n){
  return `<div class="ln ${role||''}" data-fi="${esc(fi)}" data-role="${role||''}">${who?`<div class="who">${esc(who)}</div>`:''}<div class="bub">${spk(fi)}<div class="txt"><div class="lfi">${esc(fi)}</div>${sp&&sp!==fi?`<div class="lsp t-sp">🗣 ${esc(sp)}</div>`:''}<div class="len t-en">${esc(en)}</div><div class="lne t-ne">${esc(ne)}</div></div>${n!=null?`<span class="num">${n}</span>`:''}</div></div>`}
function wireLines(box){box.addEventListener('click',e=>{const f=e.target.closest('.lfi');if(f&&box.classList.contains('test-fi'))f.closest('.ln').classList.toggle('rev')})}
const playBar=(id,role)=>`<div class="row playbar"><button class="btn pri sm" data-play="listen" data-for="${id}">▶ Listen to all</button><button class="btn ghost sm" data-play="shadow" data-for="${id}">🔁 Shadow (repeat after)</button>${role?`<button class="btn ghost sm" data-play="role" data-for="${id}">🎭 Play my role</button>`:''}<label class="tog"><input type="checkbox" data-hide="${id}"> Test me: hide the Finnish</label></div>`;
document.addEventListener('click',e=>{const b=e.target.closest('[data-play]');if(!b)return;e.preventDefault();const box=document.getElementById(b.dataset.for);if(!box)return;startPlayer($$('.ln',box),b.dataset.play,b)});
document.addEventListener('change',e=>{const c=e.target.closest('[data-hide]');if(!c)return;const box=document.getElementById(c.dataset.hide);if(box){box.classList.toggle('test-fi',c.checked);$$('.ln',box).forEach(l=>l.classList.remove('rev'))}});

  const wc=()=>{const n=($('#stW').value.trim().match(/\S+/g)||[]).length;$('#stWc').textContent=n+' words';sset(wkey,$('#stW').value);if(n>=20)markStory(s.id,'write')};$('#stW').addEventListener('input',wc);wc();

function fillItems(id,all){const b=FILL[id];return (all?shuffle(b.items):pick(b.items,10)).map(it=>({p:`<div class="qprompt">${blank(it[0])}</div><div class="mut">(${esc(it[2])}) · <span class="t-en">${esc(it[3])}</span></div>`,a:it[1].split('|'),say:it[0].replace('___',it[1].split('|')[0]),x:''}))}
function transformItems(id,all){const b=TRANSFORM[id];return (all?shuffle(b.items):pick(b.items,10)).map(it=>{const qw=id==='qw';return {p:qw?`<div class="qprompt">${blank(it[0])}</div><div class="mut t-en">${esc(it[2])}</div>`:`<div class="qprompt">${esc(it[0])}</div><div class="mut">→ ${esc(b.d)}</div>`,a:it[1].split('|'),say:qw?it[0].replace('___',it[1].split('|')[0]).split(' – ')[0]:it[1].split('|')[0],x:`<span class="t-en">${esc(it[2])}</span>`}})}

function verbItems(){const out=[];for(let k=0;k<10;k++){const v=VERBS[rnd(0,VERBS.length-1)],i=rnd(0,5);const r=Math.random();

function numItems(){const out=[];for(let k=0;k<4;k++){const n=Math.random()<.6?rnd(0,100):rnd(100,2100);out.push({p:`<div class="qprompt mono" style="font-size:2.4rem">${n}</div><div class="mut">Write it in Finnish words</div>`,a:[numFi(n),numSp(n)],say:numFi(n),x:`🗣 ${numSp(n)}`})}
  for(let k=0;k<4;k++){const n=Math.random()<.5?rnd(11,99):rnd(100,1999);out.push({p:'<div class="mut">Listen and write the number in digits</div>',audio:numFi(n),a:[String(n)],num:true,say:numFi(n),x:numFi(n)})}
  for(let k=0;k<2;k++){const d='04'+rnd(0,9)+String(rnd(1000000,9999999));const g=[d.slice(0,3),d.slice(3,6),d.slice(6)];out.push({p:'<div class="mut">Listen to the phone number and write the digits</div>',audio:g.map(x=>[...x].map(c=>ONES[+c]).join(' ')).join(', '),a:[d],num:true,say:'',x:g.join(' ')})}
  return shuffle(out)}
function priceItems(){const out=[];for(let k=0;k<10;k++){const e=rnd(1,49),c=rnd(0,19)*5;const val=e+c/100;const txt=e+','+String(c).padStart(2,'0');
  out.push({p:'<div class="mut">Listen and write the price (for example 3,50)</div>',audio:Math.random()<.7?priceFi(e,c):priceSp(e,c),a:[txt],price:val,say:'',x:`${txt} € = ${priceFi(e,c)} · 🗣 ${priceSp(e,c)}`})}return out}
function clockItems(){const out=[];for(let k=0;k<10;k++){const h=rnd(0,23),m=rnd(0,11)*5,c=clockFi(h,m);out.push({p:`<div class="row">${clockSVG(h,m)}<div class="qprompt mono">${c.txt}</div></div><div class="mut">Write the time in Finnish (12-hour way, e.g. "puoli kolme")</div>`,a:[c.w,c.sp,c.dig],say:c.w,x:`Also: ${c.dig} · At this time: ${c.lta}`})}return out}
function poolLines(story){if(story){const s=STORIES.find(x=>x.id===story);if(s)return s.lines.map(l=>l[0])}return [...STORIES.flatMap(s=>s.lines.map(l=>l[0])),...PLACES.flatMap(p=>p.lines.map(l=>l[1]))]}
function dictItems(story){const pool=poolLines(story).filter(l=>{const n=l.split(/\s+/).length;return n>=2&&n<=11});const lines=story?pool:pick(pool,10);
  return lines.map(l=>({p:'<div class="mut">Listen and write the sentence</div>',audio:l,a:[l],say:'',x:''}))}
function orderItems(story){const pool=poolLines(story).map(l=>l.replace(/["“”]/g,'')).filter(l=>{const n=l.split(/\s+/).length;return n>=3&&n<=9});const lines=story?pool:pick(pool,10);
  return lines.map(l=>{const clean=l.replace(/[.!?]+$/,'');const toks=clean.split(/\s+/);let sh=shuffle(toks);if(sh.join(' ')===toks.join(' '))sh=sh.reverse();return {type:'order',p:'<div class="mut">Tap the words in the right order</div>',tokens:sh,a:[clean],say:l,x:'Finnish word order is quite free; this checks the order used in the text.'}})}
function buildSet(id,opts){const s=EXSETS[id];const all=opts.all;
  if(!s)return [];if(s[1]==='fill')return fillItems(s[2],all);if(s[1]==='transform')return transformItems(s[2],all);if(s[1]==='transl')return translItems(all);
  if(id==='verbs')return verbItems();if(id==='spell')return spellItems();if(id==='num')return numItems();if(id==='price')return priceItems();if(id==='clock')return clockItems();
  if(id==='dict')return dictItems(opts.story);if(id==='order')return orderItems(opts.story);
  if(id==='mixed')return shuffle([...fillItems('par').slice(0,2),...fillItems('loc').slice(0,2),...transformItems('q').slice(0,2),...transformItems('qw').slice(0,2),...verbItems().slice(0,2),...translItems().slice(0,2)]);return []}
function startSet(id,opts={}){EX.id=id;EX.opts=opts;EX.items=buildSet(id,opts);EX.i=0;EX.score=0;EX.miss=[];
  $$('.extiles [data-ex]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.ex===id)));renderEx();
  const r=$('#exRun');if(r)r.scrollIntoView({block:'start',behavior:reduceMotion()?'auto':'smooth'})}
function renderEx(){const box=$('#exRun');if(!box)return;const s=EXSETS[EX.id];const it=EX.items[EX.i];EX.checked=false;
  if(!it){const n=EX.items.length;const best=sget('best:'+EX.id,0);const pct=n?Math.round(EX.score/n*100):0;if(pct>best)sset('best:'+EX.id,pct);markDay();
    if(EX.opts.story&&EX.id==='dict')markStory(EX.opts.story,'dict');
    const msg=pct>=90?'Erinomaista! Excellent.':pct>=70?'Hyvä! Good work.':pct>=50?'Ihan hyvä. Keep going.':'Harjoitus tekee mestarin. Practice makes perfect.';
    box.innerHTML=`<div class="card"><p class="eyebrow">${esc(s[0])} · result</p><div class="qprompt">${EX.score} / ${n} · ${msg}</div><p class="mut">Your best: ${Math.max(best,pct)} %</p>
    ${EX.miss.length?`<h4>Look at these again (say each one 3 times)</h4><div class="stack" style="gap:6px">${EX.miss.map(m=>`<div class="row" style="gap:8px;flex-wrap:nowrap">${spk(m)}<span class="fi">${esc(m)}</span></div>`).join('')}</div>`:'<p>No mistakes. Try another set.</p>'}
    <div class="row" style="margin-top:16px"><button class="btn pri" id="exAgain">Again with new questions</button>${EXSETS[EX.id][1]==='fill'||EXSETS[EX.id][1]==='transform'||EX.id==='tr'?'<button class="btn ghost" id="exAll">Do all items</button>':''}</div></div>`;
    $('#exAgain').onclick=()=>startSet(EX.id,{story:EX.opts.story});const al=$('#exAll');if(al)al.onclick=()=>startSet(EX.id,{all:true});return}
  const head=`<div class="row" style="justify-content:space-between"><span class="eyebrow" style="margin:0">${esc(s[0])} · ${EX.i+1} / ${EX.items.length}</span><span class="mono mut" style="font-size:.8rem">score ${EX.score}</span></div><div class="progress" style="margin:6px 0 12px;max-width:none"><i style="width:${EX.i/EX.items.length*100}%"></i></div>`;
  const audio=it.audio?`<div class="row" style="margin:8px 0"><button class="btn pri" id="exPlay">▶ Play</button><button class="btn ghost sm" id="exSlow">🐢 Slow</button></div>`:'';
  if(it.type==='order'){EX.built=[];
    box.innerHTML=head+it.p+`<div class="orderans" id="ordAns" aria-live="polite"></div><div class="chips" id="ordTok">${it.tokens.map((t,k)=>`<button class="chip tokchip" data-tk="${k}">${esc(t)}</button>`).join('')}</div><div class="row"><button class="btn pri" id="exCheck">Check</button><button class="btn ghost sm" id="ordReset">Reset</button><button class="btn ghost sm" id="exShow">Show answer</button></div><div id="exFb"></div>`;
    const draw=()=>{$('#ordAns').innerHTML=EX.built.map((k,j)=>`<button class="chip tokchip on" data-back="${j}">${esc(it.tokens[k])}</button>`).join('')||'<span class="mut">Tap words below…</span>';$$('#ordTok [data-tk]').forEach(b=>b.disabled=EX.built.includes(+b.dataset.tk))};

function exCheck(val){if(EX.checked)return;const it=EX.items[EX.i];EX.checked=true;let ok=false,r=null;
  if(val!=null&&val.trim()){
    if(it.num){ok=val.replace(/\D/g,'')===it.a[0]}
    else if(it.price!=null){const v=parseFloat(val.replace(',','.').replace(/[^\d.]/g,''));ok=Math.abs(v-it.price)<0.001}
    else{r=checkAns(val,it.a);ok=r.ok}}
  if(ok)EX.score++;else EX.miss.push(it.a[0]);countActivity();
  const target=r?r.best:it.a[0];
  $('#exFb').innerHTML=`<div class="note ${ok?'ok':'warn'}" style="margin-top:12px"><span class="lbl">${ok?'Oikein! Correct':val==null||!val.trim()?'Answer':r&&r.close?'Melkein! One letter off':'Ei aivan. Not quite'}</span>
   <div class="row" style="gap:8px">${spk(it.say||target)}<b class="fi" style="font-size:1.1rem">${!ok&&val&&r?diffHTML(val,target):esc(target)}</b></div>

  const cb=$('#exCheck');if(cb){cb.innerHTML='Next';cb.onclick=nextEx}}

function runTimer(el,prep,time){stopTimer();let phase=prep>0?'prep':'speak',left=phase==='prep'?prep:time,total=left;

  TMR={el,iv:setInterval(()=>{left--;if(left<0){if(phase==='prep'){phase='speak';left=total=time;try{navigator.vibrate&&navigator.vibrate(150)}catch(e){}}else{stopTimer();el.innerHTML='<div class="tmr done"><b>⏰ Time! Now check the model answer and rate yourself.</b></div>';return}}draw()},1000)};draw()}

function kptHL(base,res,strong,weak){
  const i=base.lastIndexOf(strong);if(i<0)return [esc(base),esc(res)];
  const b=esc(base.slice(0,i))+`<span class="kS">${esc(strong)}</span>`+esc(base.slice(i+strong.length));
  let r=esc(res);if(weak&&weak!=='–'&&res.substr(i,weak.length)===weak)r=esc(res.slice(0,i))+`<span class="kW">${esc(weak)}</span>`+esc(res.slice(i+weak.length));
  else if(weak==='–'&&res.slice(0,i)===base.slice(0,i))r=esc(res.slice(0,i))+`<span class="kW kgap">·</span>`+esc(res.slice(i));
  return [b,r]}
function kptRow(e,strong,weak){const [b,r]=kptHL(e[0],e[2],strong,weak);
  return `<div class="kprow"><span class="kpb">${b}</span><span class="kpe">+ ${esc(e[1])}</span><span class="kpa">→</span><span class="kpr">${r}</span>${spk(e[0]+', '+e[2])}<span class="kpm"><span class="t-en">${esc(e[3])}</span> <span class="ne t-ne">${esc(e[4])}</span></span></div>`}

function kptWhy(key,end){if(key==='none')return 'No change: hk, sk, st, tk and two vowels at the end never change.';
  const closes=/^(n|t|ssa|ssä|sta|stä|lla|llä|lta|ltä|lle|ksi)$/.test(end);
  return `<b>${KPT_EN_KEY[key]}</b>. ${closes?`The ending <span class="end">-${esc(end)}</span> starts with a consonant, so it closes the syllable → <b>weak</b>.`:'This ending keeps it strong.'}`}

function backupCard(){const n=Object.keys(progressDump()).length;
  return `<h3 id="backup">Back up your progress</h3><div class="card"><p style="margin:0 0 8px">Your progress (${n} saved items: flashcards, ticked days, writing, exam scores) lives only on this device. Save a backup file now and then, especially before you change phone or clear the browser.</p>

  <div class="row"><button class="btn pri sm" id="bkSave">💾 Save backup file</button><label class="btn ghost sm" for="bkFile" style="cursor:pointer">📂 Restore from file</label><input type="file" id="bkFile" accept="application/json,.json" hidden></div><div id="bkMsg" class="mut" style="margin-top:8px;font-size:.9rem"></div></div>`}
function wireBackup(){const save=$('#bkSave');if(!save)return;
  save.onclick=()=>{const blob=new Blob([JSON.stringify({app:'sana-sanalta',v:1,date:new Date().toISOString(),data:progressDump()},null,1)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sana-sanalta-progress-'+todayKey()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);$('#bkMsg').textContent='Backup saved to your downloads.'};
  $('#bkFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let j;try{j=JSON.parse(r.result)}catch(err){$('#bkMsg').textContent='That file is not a Sana Sanalta backup.';return}
    if(!j||j.app!=='sana-sanalta'||!j.data){$('#bkMsg').textContent='That file is not a Sana Sanalta backup.';return}
    const n=Object.keys(j.data).length;$('#bkMsg').innerHTML=`Restore ${n} items from ${esc((j.date||'').slice(0,10))}? This replaces the progress on this device. <button class="btn ok sm" id="bkYes">Restore</button> <button class="btn ghost sm" id="bkNo">Cancel</button>`;
    $('#bkYes').onclick=()=>{try{Object.keys(progressDump()).forEach(k=>localStorage.removeItem(k));for(const [k,v] of Object.entries(j.data))if(k.startsWith('ss2:'))localStorage.setItem(k,v);location.reload()}catch(err){$('#bkMsg').textContent='Could not restore: storage is blocked in this browser.'}};
    $('#bkNo').onclick=()=>{$('#bkMsg').textContent='';e.target.value=''}};r.readAsText(f)}}
{const _tips=RENDER.tips;RENDER.tips=()=>{_tips();$('#p-tips').insertAdjacentHTML('beforeend',backupCard());wireBackup()}}
init();
</script>
