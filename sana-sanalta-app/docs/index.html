<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="30-day Finnish course from A1.1 to A1.3 for Nepali speakers, in Finnish, English and Nepali.">
<meta name="theme-color" content="#1546B0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sana Sanalta">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
.installbtn{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;box-shadow:0 8px 24px -8px rgba(10,30,80,.5)}</style>
</head>
<body>
<title>Sana Sanalta A1.3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=Mukta:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: sticky header with a scrolling tab rail, one study column (max 1100px).
   Colour code: Finnish = lake blue, Nepali = crimson, spoken Finnish = teal green.
   Grammar families each own one hue: partitive orange, genetive violet, inside-cases blue, surface-cases green, -na/-ksi/time pink, verbs gold. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#E8EDF4; --ink:#141B2D; --muted:#5A6378; --line:#D5DCE7;
  --fi:#1546B0; --fi-soft:#E2EAFA; --on-fi:#FFFFFF;
  --ne:#B4213B; --ne-soft:#FBE5EA;
  --sp:#0E7A6B; --sp-soft:#DDF3EF;
  --ok:#1D7A4C; --ok-soft:#DFF2E7; --warn:#9A5800; --warn-soft:#FBEED6;
  --hl:#FFE27A; --hl-ink:#141B2D;
  --c-nom:#4A5568; --s-nom:#EEF1F5; --c-par:#B4530A; --s-par:#FDEDE0; --c-gen:#6A3BBD; --s-gen:#F0E9FB;
  --c-in:#1D5FD1; --s-in:#E5EDFC; --c-out:#1D7A4C; --s-out:#E1F3E8; --c-ess:#AF2E6C; --s-ess:#FBE6F0; --c-verb:#866400; --s-verb:#FBF2D2;
  --font-display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-ne:"Mukta","Noto Sans Devanagari","Kohinoor Devanagari",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B111E; --surface:#131B2C; --surface-2:#1B263D; --ink:#E6EBF5; --muted:#9AA5BC; --line:#2A3653;
    --fi:#8DB1FF; --fi-soft:#1A2A52; --on-fi:#0B111E; --ne:#FF8798; --ne-soft:#3B1823; --sp:#5FD6C2; --sp-soft:#0F3530;
    --ok:#5ED39C; --ok-soft:#123426; --warn:#F2B65C; --warn-soft:#3A2A10; --hl:#6B5A14; --hl-ink:#FFF6D6;
    --c-nom:#B7C0D0; --s-nom:#1C2536; --c-par:#FFAE6B; --s-par:#3A2414; --c-gen:#C7A8FF; --s-gen:#2A1E45; --c-in:#8DB1FF; --s-in:#172A4F;
    --c-out:#6FD8A2; --s-out:#11301F; --c-ess:#FF9CC9; --s-ess:#3A1729; --c-verb:#F0CB55; --s-verb:#352B0C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B111E; --surface:#131B2C; --surface-2:#1B263D; --ink:#E6EBF5; --muted:#9AA5BC; --line:#2A3653;
  --fi:#8DB1FF; --fi-soft:#1A2A52; --on-fi:#0B111E; --ne:#FF8798; --ne-soft:#3B1823; --sp:#5FD6C2; --sp-soft:#0F3530;
  --ok:#5ED39C; --ok-soft:#123426; --warn:#F2B65C; --warn-soft:#3A2A10; --hl:#6B5A14; --hl-ink:#FFF6D6;
  --c-nom:#B7C0D0; --s-nom:#1C2536; --c-par:#FFAE6B; --s-par:#3A2414; --c-gen:#C7A8FF; --s-gen:#2A1E45; --c-in:#8DB1FF; --s-in:#172A4F;
  --c-out:#6FD8A2; --s-out:#11301F; --c-ess:#FF9CC9; --s-ess:#3A1729; --c-verb:#F0CB55; --s-verb:#352B0C; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--fi)}
:focus-visible{outline:2px solid var(--fi);outline-offset:2px;border-radius:6px}
/* colour families */
.k-nom{--kc:var(--c-nom);--ks:var(--s-nom)}.k-par{--kc:var(--c-par);--ks:var(--s-par)}.k-gen{--kc:var(--c-gen);--ks:var(--s-gen)}.k-in{--kc:var(--c-in);--ks:var(--s-in)}.k-out{--kc:var(--c-out);--ks:var(--s-out)}.k-ess{--kc:var(--c-ess);--ks:var(--s-ess)}.k-verb{--kc:var(--c-verb);--ks:var(--s-verb)}.k-sp{--kc:var(--sp);--ks:var(--sp-soft)}.k-fi{--kc:var(--fi);--ks:var(--fi-soft)}.k-ne{--kc:var(--ne);--ks:var(--ne-soft)}
.k-soft-nom{background:var(--s-nom)!important}.k-soft-par{background:var(--s-par)!important}.k-soft-gen{background:var(--s-gen)!important}.k-soft-in{background:var(--s-in)!important}.k-soft-out{background:var(--s-out)!important}.k-soft-ess{background:var(--s-ess)!important}.k-soft-verb{background:var(--s-verb)!important}.k-soft-sp{background:var(--sp-soft)!important}.k-soft-fi{background:var(--fi-soft)!important}.k-soft-ne{background:var(--ne-soft)!important}
[class*="k-soft-"].card,[class*="k-soft-"].ctile{border-color:transparent}
.c-par{color:var(--c-par)}.c-gen{color:var(--c-gen)}.c-in{color:var(--c-in)}.c-out{color:var(--c-out)}.c-ne{color:var(--ne)}
th.c-par,th.c-gen,th.c-in{color:inherit}
.tag{display:inline-flex;align-items:center;font:600 .72rem var(--font-mono);padding:2px 8px;border-radius:999px;background:var(--ks);color:var(--kc);white-space:nowrap;vertical-align:middle}
h3.hk{display:flex;align-items:center;gap:10px}
h3.hk::before{content:"";width:12px;height:12px;border-radius:4px;background:var(--kc);flex:none}
/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px 4px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand h1{font-family:var(--font-display);font-size:1.25rem;line-height:1.1;margin:0;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:.78rem;font-weight:500}
.toggles{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tog{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.82rem;font-weight:600;cursor:pointer;user-select:none;background:var(--surface)}
.tog input{accent-color:var(--fi);margin:0}
.tog.ne-t{font-family:var(--font-ne)}
.tog.sp-t{color:var(--sp)}
.streak{font:600 .82rem var(--font-mono);color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:5px 10px;white-space:nowrap}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding-block:4px 8px;scrollbar-width:thin}
.tab{border:0;background:transparent;padding:6px 11px;border-radius:12px;cursor:pointer;color:var(--muted);white-space:nowrap;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.tab .tfi{font:600 .88rem var(--font-body)}
.tab .ten{font-size:.68rem;font-weight:500;opacity:.85}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--fi);color:var(--on-fi)}
/* type */
main .wrap{padding-block:24px 90px}
h2{font-family:var(--font-display);font-size:clamp(1.6rem,3.4vw,2.3rem);line-height:1.1;margin:0 0 8px;letter-spacing:-.02em;text-wrap:balance}
h3{font-family:var(--font-display);font-size:1.3rem;line-height:1.2;margin:36px 0 12px;letter-spacing:-.01em;text-wrap:balance;scroll-margin-top:150px}
h4{font-size:1rem;margin:0 0 6px}
p{margin:0 0 10px}
.lede{color:var(--muted);max-width:70ch;margin:0 0 18px;font-size:1.02rem}
.eyebrow{font:600 .72rem var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.fi{color:var(--fi);font-weight:600}
.ne{color:var(--ne);font-family:var(--font-ne);font-weight:500}
.sp-c{color:var(--sp);font-weight:600}
th.sp-h{color:var(--sp)}
.mut{color:var(--muted)}
.mono{font-family:var(--font-mono)}
.end{font-family:var(--font-mono);background:var(--fi-soft);color:var(--fi);padding:1px 6px;border-radius:5px;font-weight:700;font-size:.92em;white-space:nowrap}
.hl{background:var(--hl);color:var(--hl-ink);border-radius:3px;padding:0 2px}
.hide-en .t-en{display:none!important}.hide-ne .t-ne{display:none!important}.hide-sp .t-sp{display:none!important}
/* layout pieces */
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.grid.tight{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.card h4{font-family:var(--font-display);font-size:1.05rem}
.note{background:var(--surface-2);border-radius:12px;padding:14px 16px;max-width:82ch}
.note.ok{background:var(--ok-soft)}.note.warn{background:var(--warn-soft)}
.note .lbl{font:700 .72rem var(--font-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.88rem;font-weight:600;cursor:pointer;color:var(--ink);display:inline-flex;gap:6px;align-items:center;text-decoration:none}
.chip:hover{border-color:var(--fi)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:disabled{opacity:.35;cursor:default}
.chip .cnt{font:500 .72rem var(--font-mono);opacity:.75}
.grp-label{display:block;font:700 .7rem var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 6px}
.say{flex:none;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;width:32px;height:32px;display:inline-grid;place-items:center;cursor:pointer;color:var(--fi);padding:0;vertical-align:middle}
.say:hover{background:var(--fi);color:var(--on-fi);border-color:var(--fi)}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-size:.95rem;cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center;text-decoration:none}
.btn:disabled{opacity:.45;cursor:default}
.btn.pri{background:var(--fi);color:var(--on-fi)}.btn.ok{background:var(--ok);color:var(--on-fi)}.btn.again{background:var(--ne-soft);color:var(--ne)}.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:.85rem;border-radius:8px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
tr:last-child td{border-bottom:0}
th{font:700 .7rem var(--font-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);white-space:nowrap}
input[type="search"],input[type="text"],input[type="number"],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;width:100%;max-width:440px}
textarea{max-width:none;min-height:96px;resize:vertical}
.jump{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;margin-bottom:6px}
.jump a{flex:none;font-size:.82rem;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink);text-decoration:none}
.jump a:hover{background:var(--fi);color:var(--on-fi)}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 6px}
/* a Finnish line */
.li{display:flex;gap:8px;align-items:flex-start;min-width:0}
.lt{flex:1;min-width:0}
.lfi{color:var(--fi);font-weight:600}
.len{font-size:.88rem}
.lne{font-size:.9rem;color:var(--ne);font-family:var(--font-ne)}
.lsp{font-size:.9rem;color:var(--sp);font-weight:600}
.pairs{display:flex;flex-wrap:wrap;gap:6px 12px}
.pair{font-size:.95rem;overflow-wrap:anywhere}
.pair2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.sp-side{background:var(--sp-soft);border-radius:8px;padding:8px 10px;align-self:start}
.qa{border-top:1px dashed var(--line);padding-top:6px}
.qgroup{border-radius:16px;padding:16px;scroll-margin-top:150px}
.steps{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.step{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.forms3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:6px 0;width:100%;max-width:420px}
.forms3 div{display:flex;flex-direction:column;background:var(--surface-2);border-radius:10px;padding:6px 8px}
.forms3 b{color:var(--fi);font-size:1.05rem;overflow-wrap:anywhere}
.spk-chip{display:inline-flex;gap:8px;align-items:center;color:var(--sp);font-weight:600;background:var(--sp-soft);border-radius:999px;padding:2px 4px 2px 12px}
/* word cards */
.wc{display:flex;flex-direction:column;gap:4px}
.wc .top{display:flex;align-items:flex-start;gap:10px}
.wc .emo{font-size:2.1rem;line-height:1;flex:none;width:44px;text-align:center}
.wc .w{flex:1;min-width:0}
.wc .wfi{font-family:var(--font-display);font-size:1.2rem;color:var(--fi);font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.wc .wen{font-size:.92rem}
.wc .ex{margin-top:6px;padding-top:8px;border-top:1px dashed var(--line);font-size:.9rem}
/* flashcards */
.fc-wrap{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
.fc-stage{perspective:1400px;width:100%;max-width:620px;margin:0 auto}
.fc{position:relative;height:400px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1);cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:22px;text-align:center;overflow:auto;box-shadow:0 10px 30px -18px rgba(10,30,80,.45)}
.face.back{transform:rotateY(180deg)}
.fc.flip .front,.fc:not(.flip) .back{pointer-events:none}
.fc .bigemo{font-size:4.4rem;line-height:1}
.fc .bigfi{font-family:var(--font-display);font-size:clamp(1.6rem,5vw,2.4rem);color:var(--fi);font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.fc .bigen{font-family:var(--font-display);font-size:clamp(1.3rem,4vw,1.9rem);font-weight:700;line-height:1.15}
.fc .bigne{font-family:var(--font-ne);font-size:clamp(1.2rem,4vw,1.7rem);color:var(--ne);font-weight:600}
.fc .hint{font-size:.8rem;color:var(--muted)}
.fc .exb{font-size:.95rem;max-width:46ch;margin-top:6px}
.forms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 16px;font-size:.88rem;text-align:left;margin-top:6px}
.fc-ctrl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.fc-ctrl .btn{min-width:140px}
.progress{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden;max-width:620px;margin:0 auto;width:100%}
.progress i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.kbd{font:600 .72rem var(--font-mono);border:1px solid currentColor;border-bottom-width:2px;border-radius:5px;padding:0 5px;opacity:.7}
/* lego + cases */
.lego{display:flex;flex-wrap:wrap;gap:4px}
.lego span{font:700 1.05rem var(--font-mono);padding:8px 12px;border-radius:8px;color:#0B111E}
.lego .l1{background:#9DB9F5}.lego .l2{background:#FFD36B}.lego .l3{background:#F7A8B5}.lego .l4{background:#A8DFC0}
.lego.ne span{font-family:var(--font-ne);font-weight:600}
.cases6{display:grid;gap:12px;grid-template-columns:repeat(3,minmax(0,1fr))}
.ctile{border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.ctile svg{width:76px;height:54px}
.s-box{fill:none;stroke:var(--c-in);stroke-width:2.5}.s-surf{fill:none;stroke:var(--c-out);stroke-width:3;stroke-linecap:round}
.s-arr{fill:none;stroke:var(--ne);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.s-dot{fill:var(--ne)}
.ctile .big{font:700 1.3rem var(--font-mono);color:var(--ink)}
.axis-label{font:700 .7rem var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
/* builder */
.builder{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}
.out{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.res{font-family:var(--font-display);font-size:clamp(1.5rem,4vw,2.1rem);color:var(--fi);font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.res .hl{color:var(--hl-ink)}
/* dialogue + stories */
.places{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));margin-bottom:22px}
.ptile{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.ptile .pe{font-size:1.8rem;line-height:1}
.ptile .pf{font-weight:700;color:var(--fi);font-size:.95rem;overflow-wrap:anywhere}
.ptile .pn{font-size:.78rem;color:var(--muted)}
.ptile[aria-pressed="true"]{border-color:var(--fi);box-shadow:inset 0 0 0 1px var(--fi);background:var(--fi-soft)}
.playbar{margin:14px 0}
.dlg{display:flex;flex-direction:column;gap:8px;max-width:840px}
.ln{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-items:start}
.ln:has(.who){grid-template-columns:60px minmax(0,1fr)}
.ln .who{font:700 .68rem var(--font-mono);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding-top:12px;text-align:right;overflow-wrap:anywhere}
.ln .bub{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;min-width:0}
.ln.B .bub{background:var(--fi-soft);border-color:transparent}
.ln .txt{flex:1;min-width:0}
.ln .lfi{font-size:1.04rem}
.ln.speaking .bub{box-shadow:0 0 0 2px var(--fi)}
.ln.yourturn .bub{box-shadow:0 0 0 2px var(--ok);background:var(--ok-soft)}
.test-fi .ln:not(.rev) .lfi,.test-fi .ln:not(.rev) .lsp{filter:blur(6px);cursor:pointer;user-select:none}

['Endings are Nepali विभक्ति','Finnish glues small endings onto words, the way Nepali adds -मा, -बाट, -को. talo-ssa = घर-मा. Learn an ending once and it works on every word.'],

['Say every letter','Spelling is phonetic, like Devanagari. A double letter is held longer: kukka sounds like पक्का. Careful: tapan = I kill, tapaan = I meet!'],
['Long words are short words glued','rauta + tie + asema = iron + road + station = railway station. Read from the end: the last part is the main thing.'],

['B','Voinko maksaa kortilla?','Can I pay by card?','कार्डबाट तिर्न सक्छु?'],
['A','Voit. Näytä korttia lukijalle.','You can. Hold your card to the reader.','सक्नुहुन्छ। कार्ड मेसिनमा देखाउनुहोस्।'],
['B','Kuinka kauan matka kestää?','How long does the trip take?','यात्रामा कति समय लाग्छ?'],
['A','Noin viisitoista minuuttia.','About fifteen minutes.','करिब पन्ध्र मिनेट।'],
['B','Voitko sanoa, kun olemme kauppatorilla?','Can you tell me when we are at the market square?','बजार चोक पुगेपछि भनिदिनुहुन्छ?'],
['A','Joo, sanon.','Yes, I will.','हुन्छ, भनिदिन्छु।'],
['B','Anteeksi, onko tämä paikka vapaa?','Excuse me, is this seat free?','माफ गर्नुहोस्, यो सिट खाली छ?'],
['C','On, istu vain.','Yes, go ahead and sit.','छ, बस्नुहोस्।'],
['A','Seuraava pysäkki on Kauppatori.','The next stop is the Market Square.','अर्को बिसौनी बजार चोक हो।'],
['B','Painan nappia.','I press the button.','म बटन थिच्छु।'],
['B','Kiitos, hei hei!','Thanks, bye!','धन्यवाद, बाई!'],
['A','Hei hei, hyvää päivää!','Bye, have a good day!','बाई, दिन राम्रो होस्!']],
words:[['pysäkki','stop','बिसौनी'],['lippu','ticket','टिकट'],['keskusta','centre','शहरको केन्द्र'],['seuraava','next','अर्को'],['vaihtaa','to change (bus)','फेर्नु'],['myöhässä','late','ढिलो'],['paikka','seat, place','सिट / ठाउँ']],
tip:'Press the STOP button before your stop, or the bus will not stop. Greet the driver with "Moi". In Turku the buses are run by Föli and in Helsinki by HSL; both have ticket apps.'},

{id:'train',e:'🚆',fi:'Rautatieasemalla',en:'At the railway station',ne:'रेलवे स्टेसनमा',roles:{A:['Virkailija','ticket clerk','टिकट कर्मचारी'],B:['Sinä','you','तपाईं']},
lines:[
['B','Hyvää päivää. Haluaisin ostaa junalipun Helsinkiin.','Good day. I would like to buy a train ticket to Helsinki.','नमस्कार। मलाई हेल्सिंकीको रेल टिकट किन्नु छ।'],

['B','Huomenna aamulla.','Tomorrow morning.','भोलि बिहान।'],
['A','Juna lähtee kello 7.05 tai 8.05.','The train leaves at 7:05 or 8:05.','रेल ७:०५ वा ८:०५ मा छुट्छ।'],
['B','Otan sen, joka lähtee kahdeksalta. Paljonko lippu maksaa?','I\'ll take the one at eight. How much is the ticket?','म आठ बजेको लिन्छु। टिकट कति पर्छ?'],

['B','Meno-paluu, kiitos. Palaan sunnuntaina.','Return, please. I am coming back on Sunday.','दोहोरो, धन्यवाद। म आइतबार फर्किन्छु।'],
['A','Onko sinulla opiskelija-alennus?','Do you have a student discount?','तपाईंलाई विद्यार्थी छुट छ?'],
['B','On. Tässä on opiskelijakorttini.','Yes. Here is my student card.','छ। यो मेरो विद्यार्थी कार्ड हो।'],
['A','Kiitos. Yhteensä 38 euroa.','Thanks. 38 euros in total.','धन्यवाद। जम्मा ३८ युरो।'],
['B','Miltä raiteelta juna lähtee?','Which track does the train leave from?','रेल कुन प्लेटफर्मबाट छुट्छ?'],
['A','Raiteelta kolme.','From track three.','तीन नम्बर प्लेटफर्मबाट।'],
['B','Onko junassa ravintolavaunu?','Is there a restaurant car on the train?','रेलमा खाना पाइने डिब्बा छ?'],
['A','On, vaunussa numero neljä.','Yes, in car number four.','छ, चार नम्बर डिब्बामा।'],
['B','Onko juna tänään myöhässä?','Is the train late today?','आज रेल ढिला छ?'],
['A','Ei, se on aikataulussa.','No, it is on schedule.','होइन, समयमै छ।'],
['B','Hienoa. Kiitos avusta!','Great. Thanks for your help!','राम्रो। सहयोगको लागि धन्यवाद!'],
['A','Hyvää matkaa!','Have a good trip!','शुभ यात्रा!']],
words:[['raide','track, platform','प्लेटफर्म'],['meno','one way','एकतर्फी'],['meno-paluu','return','दोहोरो'],['vaunu','carriage','डिब्बा'],['aikataulu','timetable','समयतालिका'],['lähtö','departure','प्रस्थान'],['saapuminen','arrival','आगमन']],

{id:'health',e:'🩺',fi:'Terveyskeskuksessa',en:'At the health centre',ne:'स्वास्थ्य केन्द्रमा',roles:{A:['Hoitaja','nurse','नर्स'],B:['Sinä','you','तपाईं'],C:['Lääkäri','doctor','डाक्टर']},
lines:[
['A','Terveyskeskus, hoitaja Laine. Miten voin auttaa?','Health centre, nurse Laine. How can I help?','स्वास्थ्य केन्द्र, नर्स लाइने। म कसरी सहयोग गरूँ?'],
['B','Hei. Olen sairas. Haluaisin varata ajan lääkärille.','Hi. I am sick. I would like to book a doctor\'s appointment.','नमस्ते। म बिरामी छु। डाक्टरसँग समय लिन चाहन्छु।'],
['A','Mitä oireita sinulla on?','What symptoms do you have?','तपाईंलाई के-के लक्षण छन्?'],
['B','Minulla on kuumetta ja kurkku on kipeä.','I have a fever and my throat is sore.','मलाई ज्वरो आएको छ र घाँटी दुखेको छ।'],
['A','Kuinka kauan sinulla on ollut kuumetta?','How long have you had a fever?','कति दिनदेखि ज्वरो छ?'],
['B','Kolme päivää.','Three days.','तीन दिन।'],
['A','Pääsisitkö tänään kello 14?','Could you come today at 2 pm?','आज दिउँसो २ बजे आउन सक्नुहुन्छ?'],
['B','Pääsen. Kiitos.','Yes, I can. Thank you.','सक्छु। धन्यवाद।'],
['A','Tervetuloa. Saanko Kela-korttisi?','Welcome. May I have your Kela card?','स्वागत छ। तपाईंको केला कार्ड पाउँ?'],
['B','Tässä, ole hyvä.','Here you are.','लिनुहोस्।'],
['C','Hei, mikä sinua vaivaa?','Hello, what seems to be the problem?','नमस्ते, के समस्या छ?'],
['B','Kurkkuun sattuu, ja minulla on päänsärkyä.','My throat hurts and I have a headache.','घाँटी दुख्छ, र टाउको पनि दुखेको छ।'],
['C','Avaa suu, ole hyvä. Sano "aa".','Open your mouth, please. Say "aah".','मुख खोल्नुहोस्। "आ" भन्नुहोस्।'],
['C','Kurkku on tulehtunut. Kirjoitan sinulle reseptin.','Your throat is infected. I will write you a prescription.','घाँटीमा संक्रमण छ। म तपाईंलाई औषधि लेखिदिन्छु।'],
['B','Kuinka usein lääkettä otetaan?','How often do I take the medicine?','औषधि कति पटक खाने?'],
['C','Kolme kertaa päivässä, viikon ajan.','Three times a day, for a week.','दिनमा तीन पटक, एक हप्तासम्म।'],
['B','Tarvitsenko sairauslomaa?','Do I need sick leave?','मलाई बिरामी बिदा चाहिन्छ?'],
['C','Kyllä. Kirjoitan sinulle kolme päivää sairauslomaa.','Yes. I will write you three days of sick leave.','हो। म तपाईंलाई तीन दिनको बिरामी बिदा लेखिदिन्छु।'],
['B','Kiitos paljon. Näkemiin.','Thank you very much. Goodbye.','धेरै धन्यवाद। फेरि भेटौंला।'],
['C','Parane pian!','Get well soon!','छिटो निको हुनुहोस्!']],
words:[['oire','symptom','लक्षण'],['kuume','fever','ज्वरो'],['kipeä','sore, painful','दुखेको'],['sattuu','it hurts','दुख्छ'],['resepti','prescription','प्रेस्क्रिप्सन'],['sairausloma','sick leave','बिरामी बिदा'],['ajanvaraus','appointment','समय बुकिङ']],
tip:'In an emergency call 112. For medical advice day and night call the Medical Helpline 116 117. A health centre visit is usually booked by phone or online first.'},

{id:'pharmacy',e:'💊',fi:'Apteekissa',en:'At the pharmacy',ne:'औषधि पसलमा',roles:{A:['Farmaseutti','pharmacist','फार्मासिस्ट'],B:['Sinä','you','तपाईं']},
lines:[
['A','Seuraava, olkaa hyvä!','Next, please!','अर्को, आउनुहोस्!'],
['B','Hei. Minulla on resepti. Se on sähköinen.','Hi. I have a prescription. It is electronic.','नमस्ते। मसँग प्रेस्क्रिप्सन छ। यो इलेक्ट्रोनिक हो।'],
['A','Saanko Kela-korttisi?','May I have your Kela card?','तपाईंको केला कार्ड पाउँ?'],
['B','Tässä, ole hyvä.','Here you are.','लिनुहोस्।'],
['A','Kiitos. Tässä on antibiootti. Ota yksi tabletti kolme kertaa päivässä.','Thanks. Here is the antibiotic. Take one tablet three times a day.','धन्यवाद। यो एन्टिबायोटिक हो। दिनमा तीन पटक एउटा चक्की खानुहोस्।'],
['B','Otetaanko se ruoan kanssa?','Is it taken with food?','खानासँगै खाने हो?'],
['A','Kyllä, ruoan kanssa. Syö koko kuuri loppuun.','Yes, with food. Finish the whole course.','हो, खानासँगै। पूरा कोर्स सक्नुहोस्।'],
['B','Onko teillä jotain yskään?','Do you have something for a cough?','खोकीको लागि केही छ?'],
['A','Onko yskä kuiva vai limainen?','Is the cough dry or chesty?','खोकी सुक्खा हो कि खकार आउने?'],
['B','Kuiva.','Dry.','सुक्खा।'],
['A','Suosittelen tätä yskänlääkettä. Ota se illalla ennen nukkumaanmenoa.','I recommend this cough medicine. Take it in the evening before bed.','म यो खोकीको औषधि सिफारिस गर्छु। बेलुका सुत्नुअघि खानुहोस्।'],
['B','Väsyttääkö se?','Does it make you drowsy?','यसले निद्रा लगाउँछ?'],
['A','Se voi väsyttää vähän. Älä aja autoa sen jälkeen.','It may make you a little drowsy. Don\'t drive after taking it.','अलिकति निद्रा लाग्न सक्छ। त्यसपछि गाडी नचलाउनुहोस्।'],
['B','Selvä. Tarvitsen myös särkylääkettä.','Okay. I also need painkillers.','ठीक छ। मलाई दुखाइको औषधि पनि चाहियो।'],
['A','Parasetamolia vai ibuprofeenia?','Paracetamol or ibuprofen?','प्यारासिटामोल कि आइबुप्रोफेन?'],
['B','Parasetamolia, kiitos. Paljonko kaikki maksaa?','Paracetamol, please. How much is everything?','प्यारासिटामोल, धन्यवाद। सबै गरेर कति भयो?'],
['A','Yhteensä 24 euroa. Kela-korvaus on jo vähennetty.','24 euros in total. The Kela reimbursement is already deducted.','जम्मा २४ युरो। केलाको छुट पहिल्यै घटाइएको छ।'],
['B','Kiitos avusta!','Thanks for your help!','सहयोगको लागि धन्यवाद!'],
['A','Parane pian!','Get well soon!','छिटो निको हुनुहोस्!']],
words:[['lääke','medicine','औषधि'],['tabletti','tablet','चक्की'],['yskä','cough','खोकी'],['särkylääke','painkiller','दुखाइको औषधि'],['kuuri','course (of medicine)','कोर्स'],['annos','dose','मात्रा'],['sivuvaikutus','side effect','साइड इफेक्ट']],
tip:'Prescriptions are electronic (e-resepti), so you only show your Kela card or ID. Many medicines, even some painkillers in bigger packs, are sold only in pharmacies.'},

{id:'bank',e:'🏦',fi:'Pankissa',en:'At the bank',ne:'बैंकमा',roles:{A:['Virkailija','bank clerk','बैंक कर्मचारी'],B:['Sinä','you','तपाईं']},
lines:[
['A','Hyvää huomenta! Miten voin auttaa?','Good morning! How can I help?','शुभ प्रभात! म कसरी सहयोग गरूँ?'],
['B','Huomenta. Haluaisin avata pankkitilin.','Morning. I would like to open a bank account.','शुभ प्रभात। म बैंक खाता खोल्न चाहन्छु।'],
['A','Onko sinulla varattu aika?','Do you have an appointment?','तपाईंले समय बुक गर्नुभएको छ?'],
['B','Kyllä, kello kymmenen.','Yes, at ten o\'clock.','हो, दस बजे।'],
['A','Hienoa. Tarvitsen passisi ja oleskeluluvan.','Great. I need your passport and residence permit.','राम्रो। मलाई तपाईंको राहदानी र बसोबास अनुमतिपत्र चाहिन्छ।'],
['B','Tässä ne ovat.','Here they are.','यी हुन्।'],
['A','Onko sinulla suomalainen henkilötunnus?','Do you have a Finnish personal identity code?','तपाईंसँग फिनिस व्यक्तिगत परिचय नम्बर छ?'],
['B','On.','Yes, I do.','छ।'],
['A','Missä olet töissä?','Where do you work?','तपाईं कहाँ काम गर्नुहुन्छ?'],
['B','Olen töissä IT-yrityksessä ja opiskelen yliopistossa.','I work at an IT company and study at the university.','म आईटी कम्पनीमा काम गर्छु र विश्वविद्यालयमा पढ्छु।'],
['A','Selvä. Haluatko myös pankkikortin?','Okay. Do you also want a bank card?','ठीक छ। बैंक कार्ड पनि चाहिन्छ?'],
['B','Kyllä, kiitos. Saanko myös verkkopankkitunnukset?','Yes, please. Can I also get online banking codes?','हो, धन्यवाद। अनलाइन बैंकिङको लगइन पनि पाउँछु?'],
['A','Saat. Tunnuksilla voit kirjautua myös viranomaisten palveluihin.','Yes. With them you can also log in to government services.','पाउनुहुन्छ। त्यसैले सरकारी सेवाहरूमा पनि लगइन गर्न सकिन्छ।'],
['B','Kuinka kauan kortin tulo kestää?','How long does the card take to arrive?','कार्ड आउन कति समय लाग्छ?'],
['A','Noin viikon. Se tulee postissa kotiisi.','About a week. It comes to your home by post.','करिब एक हप्ता। हुलाकबाट घरमै आउँछ।'],
['B','Voinko lähettää rahaa Nepaliin?','Can I send money to Nepal?','म नेपालमा पैसा पठाउन सक्छु?'],
['A','Voit, ulkomaanmaksuna verkkopankissa. Siitä on pieni maksu.','Yes, as an international payment in online banking. There is a small fee.','सक्नुहुन्छ, अनलाइन बैंकिङबाट विदेशी भुक्तानी गरेर। सानो शुल्क लाग्छ।'],
['B','Kiitos, tämä oli tosi hyödyllistä.','Thanks, this was really useful.','धन्यवाद, यो एकदम उपयोगी भयो।'],
['A','Ole hyvä. Hyvää päivänjatkoa!','You are welcome. Have a nice day!','केही छैन। दिन राम्रो बितोस्!']],
words:[['pankkitili','bank account','बैंक खाता'],['pankkikortti','bank card','बैंक कार्ड'],['tunnukset','login codes','लगइन'],['passi','passport','राहदानी'],['oleskelulupa','residence permit','बसोबास अनुमति'],['henkilötunnus','ID code','परिचय नम्बर'],['maksu','payment, fee','भुक्तानी / शुल्क']],
tip:'Online banking codes (pankkitunnukset) are also your login to Kela, Vero (tax) and other public services, so keep them safe and never share them.'},

{id:'post',e:'📦',fi:'Postissa',en:'At the post office',ne:'हुलाकमा',roles:{A:['Virkailija','clerk','कर्मचारी'],B:['Sinä','you','तपाईं']},

['A','Saanko nähdä henkilöllisyystodistuksen?','May I see your ID?','तपाईंको परिचयपत्र हेर्न पाउँ?'],
['B','Tässä on ajokorttini.','Here is my driving licence.','यो मेरो ड्राइभिङ लाइसेन्स हो।'],

['B','Kiitos. Haluaisin myös lähettää kirjeen.','Thanks. I would also like to send a letter.','धन्यवाद। म एउटा चिठी पनि पठाउन चाहन्छु।'],
['A','Mihin maahan?','To which country?','कुन देशमा?'],
['B','Nepaliin. Paljonko se maksaa?','To Nepal. How much does it cost?','नेपाल। कति पर्छ?'],
['A','Hinta riippuu painosta. Laitetaan kirje vaa\'alle.','The price depends on the weight. Let\'s put the letter on the scale.','मूल्य तौलमा भर पर्छ। चिठी तराजुमा राखौं।'],
['A','Se maksaa kolme euroa viisikymmentä.','It costs three euros fifty.','यो तीन युरो पचास पर्छ।'],
['B','Kuinka kauan kirje kulkee Nepaliin?','How long does a letter take to Nepal?','चिठी नेपाल पुग्न कति समय लाग्छ?'],

// ---------- PARTITIVE ----------
// uses: [icon, title, rule, ne, examples [[fi,en,ne]]]
const PART_USES=[
['🔢','After numbers 2, 3, 4 …','After any number except 1, the noun goes into the partitive. The number is the "whole", the noun is "part of" it.','२ भन्दा माथिको संख्यापछि',[['kaksi kahvia','two coffees','दुई कफी'],['kolme lasta','three children','तीन बच्चा'],['viisi euroa','five euros','पाँच युरो'],['yksi kahvi','one coffee (no partitive with 1!)','एक कफी']]],
['⚖️','After amounts and containers','Words like paljon, vähän, liian, kilo, litra, kuppi, lasi, pullo, pala, pussi.','धेरै / थोरै / किलो / कप पछि',[['paljon rahaa','a lot of money','धेरै पैसा'],['vähän aikaa','a little time','अलिकति समय'],['kuppi teetä','a cup of tea','एक कप चिया'],['lasi vettä','a glass of water','एक गिलास पानी'],['kilo perunoita','a kilo of potatoes','एक किलो आलु']]],
['🥛','"Some" of a mass (you cannot count it)','Water, milk, coffee, bread, money, time, snow … When you mean "some" or "any", use the partitive.','अलिकति / केही (गन्न नसकिने कुरा)',[['Juon vettä.','I drink (some) water.','म पानी पिउँछु।'],['Ostan maitoa.','I buy (some) milk.','म दूध किन्छु।'],['Syön leipää.','I eat (some) bread.','म रोटी खान्छु।'],['Ulkona on lunta.','There is snow outside.','बाहिर हिउँ छ।']]],
['🚫','Every negative sentence','When the sentence has "not", the object becomes partitive. "Minulla ei ole …" always takes the partitive.','"छैन / गर्दिनँ" भएको वाक्यमा',[['Minulla ei ole autoa.','I don\'t have a car.','मसँग गाडी छैन।'],['En juo kahvia.','I don\'t drink coffee.','म कफी पिउँदिनँ।'],['En ymmärrä tätä.','I don\'t understand this.','मलाई यो बुझिएन।'],['Täällä ei ole vessaa.','There is no toilet here.','यहाँ शौचालय छैन।']]],
['❤️','After "partitive verbs"','Some verbs always take the partitive: rakastaa, odottaa, auttaa, opiskella, kuunnella, ajatella, etsiä, harrastaa, pelata, tervehtiä, kiittää, katsoa (TV).','केही क्रियापछि सधैं',[['Rakastan sinua.','I love you.','म तिमीलाई माया गर्छु।'],['Odotan bussia.','I am waiting for the bus.','म बस पर्खिरहेको छु।'],['Autan äitiä.','I help Mother.','म आमालाई सहयोग गर्छु।'],['Opiskelen suomea.','I study Finnish.','म फिनिस पढ्छु।'],['Kuuntelen musiikkia.','I listen to music.','म संगीत सुन्छु।']]],
['⏳','Action still going on, not finished','Partitive = "in the middle of it". Total object (-n) = "done, the whole thing".','काम चलिरहेको (नसकिएको)',[['Luen kirjaa.','I am reading a book (not finished).','म किताब पढ्दैछु।'],['Luin kirjan.','I read the (whole) book.','मैले किताब पढिसकेँ।'],['Kirjoitan kirjettä.','I am writing a letter.','म चिठी लेख्दैछु।']]],
['❓','Questions about having / existing','When you ask if something exists or if someone has "any", use the partitive.','"छ कि?" भनेर सोध्दा',[['Onko teillä maitoa?','Do you have (any) milk?','तपाईंसँग दूध छ?'],['Onko sinulla aikaa?','Do you have time?','तिमीसँग समय छ?'],['Onko sinulla lapsia?','Do you have children?','तिम्रा बच्चा छन्?']]],
['🌡️','Describing a mass word','"Kahvi on kuumaa" (the mass is hot) – but "Talo on iso" (a countable thing).','गन्न नसकिने कुराको वर्णन',[['Kahvi on kuumaa.','The coffee is hot.','कफी तातो छ।'],['Vesi on kylmää.','The water is cold.','पानी चिसो छ।'],['Ruoka on hyvää.','The food is good.','खाना मीठो छ।']]],
['🔗','After ilman (without) and some little words','ilman sokeria = without sugar. Also: ennen kahdeksaa = before eight.','बिना',[['kahvi ilman sokeria','coffee without sugar','चिनी बिनाको कफी'],['tee ilman maitoa','tea without milk','दूध बिनाको चिया']]]
];
// how to form: [rule title, ending, explanation, examples [[base, partitive]]]
const PART_FORM=[
['Ends in one short vowel','+ a / ä','The most common rule. Just add a or ä. Keep the strong consonant (kauppa, not kaupa).',[['talo','taloa'],['kissa','kissaa'],['koira','koiraa'],['kauppa','kauppaa'],['leipä','leipää'],['pöytä','pöytää'],['kahvi','kahvia'],['bussi','bussia'],['omena','omenaa'],['euro','euroa']]],
['Ends in two vowels (long vowel or diphthong)','+ ta / tä','Short words like maa, tee, työ, puu, and loan words ending in a long vowel.',[['maa','maata'],['tee','teetä'],['työ','työtä'],['puu','puuta'],['suu','suuta'],['jää','jäätä'],['Lontoo','Lontoota'],['vapaa','vapaata']]],
['Ends in -e','+ tta / ttä','Double t. Very common with words like huone, perhe, kirje.',[['huone','huonetta'],['perhe','perhettä'],['kone','konetta'],['kirje','kirjettä'],['vene','venettä'],['sade','sadetta'],['kappale','kappaletta']]],

{id:'vtypes',lvl:'A1.1',e:'⚙️',fi:'Verbityypit 1–6',en:'Verb types 1–6: the system behind every verb',ne:'क्रियाका ६ प्रकार',
intro:['Every Finnish verb belongs to one of six types. The ending of the dictionary form tells you the type, and the type tells you how to cut and add. Learn one model verb per type and you can conjugate thousands.','हरेक क्रिया ६ प्रकारमध्ये एकमा पर्छ। शब्दको अन्त्य हेरेर प्रकार चिनिन्छ। हरेक प्रकारको एउटा नमुना क्रिया सिक्नुहोस्।'],
blocks:[
{t:'table',h:'Find the type from the last letters',cols:['Type','Ends in','Make the stem','minä','Model verbs'],rows:[
['**1**','two vowels: -aa -ea -ia -oa -ua -ää -eä -iä -yä','remove the last a/ä','[[puhu-n]]','puhua, asua, ottaa, lukea, kysyä, oppia'],
['**2**','-da / -dä','remove -da/-dä','[[syö-n]]','syödä, juoda, tehdä, nähdä, saada, voida, käydä'],
['**3**','-lla -nna -rra -sta (two consonants + a)','remove la/na/ra/ta, add **e**','[[tule-n]]','tulla, mennä, opiskella, nousta, pestä'],
['**4**','vowel + ta/tä: -ata -ota -uta -ätä','remove -ta, add **a/ä**','[[halua-n]]','haluta, tavata, osata, pelata, siivota'],
['**5**','-ita / -itä','remove -ta, add **tse**','[[tarvitse-n]]','tarvita, valita, häiritä'],
['**6**','-eta / -etä','remove -ta, add **ne**','[[vanhene-n]]','vanheta, lämmetä']]},
{t:'table',h:'One model verb per type',cols:['','1 · puhua','2 · syödä','3 · tulla','4 · haluta','5 · tarvita'],rows:[
['minä','[[puhun]]','[[syön]]','[[tulen]]','[[haluan]]','[[tarvitsen]]'],['sinä','[[puhut]]','[[syöt]]','[[tulet]]','[[haluat]]','[[tarvitset]]'],['hän','[[puhuu]]','[[syö]]','[[tulee]]','[[haluaa]]','[[tarvitsee]]'],
['me','[[puhumme]]','[[syömme]]','[[tulemme]]','[[haluamme]]','[[tarvitsemme]]'],['te','[[puhutte]]','[[syötte]]','[[tulette]]','[[haluatte]]','[[tarvitsette]]'],['he','[[puhuvat]]','[[syövät]]','[[tulevat]]','[[haluavat]]','[[tarvitsevat]]'],
['not','[[en puhu]]','[[en syö]]','[[en tule]]','[[en halua]]','[[en tarvitse]]'],['spoken me','{{me puhutaan}}','{{me syödään}}','{{me tullaan}}','{{me halutaan}}','{{me tarvitaan}}']]},
{t:'steps',h:'Conjugate any new verb in 4 steps',items:[['Find the type from the ending (table above).','अन्त्य हेरेर प्रकार पत्ता लगाउनुहोस्।'],['Cut to the stem: puhu-, syö-, tule-, halua-.','मूल भाग (stem) निकाल्नुहोस्।'],['Type 1: minä, sinä, me, te get the weak consonant (nukkua → nukun). Types 3–4: the stem gets the strong one (tavata → tapaan).','KPT: प्रकार १ मा कमजोर, प्रकार ३–४ मा बलियो।'],['Add the person ending: -n, -t, (double the vowel), -mme, -tte, -vat/-vät.','पुरुष अनुसार अन्त्य थप्नुहोस्।']]},
{t:'rule',h:'The hän form',en:'hän = stem + the last vowel again: [[puhu → puhuu]], [[tule → tulee]], [[halua → haluaa]]. If the stem already ends in two vowels, nothing is added: [[syö]], [[juo]], [[saa]], [[ottaa]].',ne:'hän = stem + अन्तिम स्वर फेरि: [[puhuu]]। पहिल्यै दुई स्वर भए केही थप्दैन: [[syö]]।'},
{t:'cards',h:'Memory pictures for each type',items:[
['1 · "Two vowels"','The biggest, most normal group. Two vowels at the end → type 1.','अन्त्यमा दुई स्वर = प्रकार १।',['asua → asun','lukea → luen','kysyä → kysyn']],
['2 · "D for Drink, Dine, Do"','syödä (dine), juoda (drink), tehdä (do), nähdä, saada, voida, käydä, myydä, uida.','d भएका क्रिया: खाने, पिउने, गर्ने।',['juoda → juon','tehdä → teen','käydä → käyn']],
['3 · "Two of the same"','ll, nn, rr or st before the last a: tulla, mennä, purra, nousta. Add e.','दुई एउटै व्यञ्जन: ll, nn।',['mennä → menen','opiskella → opiskelen','pestä → pesen']],
['4 · "The a appears"','halu-ta → halu-a-n. The vowel before -ta is doubled in the minä form.','-ta हटाएर a थप्ने।',['osata → osaan','pelata → pelaan','tavata → tapaan']],
['5 · "-ita → -itse"','tarvita → tarvitsen, valita → valitsen. Few verbs, learn them as words.','थोरै क्रिया, शब्दकै रूपमा सिक्नुहोस्।',['tarvita → tarvitsen','valita → valitsen']],
['6 · "-eta → -ene"','Changes of state: vanheta (grow old) → vanhenen, lämmetä (get warm) → lämpenee.','"बन्नु" अर्थका क्रिया।',['vanheta → vanhenen','lämmetä → lämpenee']]]},
{t:'ex',h:'Examples from daily life',items:[
['Asun Turussa.','I live in Turku. (type 1)','म टुर्कुमा बस्छु।','Mä asun Turussa.'],['Luen kirjaa.','I am reading a book. (1, lukea)','म किताब पढ्दैछु।','Mä luen kirjaa.'],['Juon teetä aamulla.','I drink tea in the morning. (2)','म बिहान चिया पिउँछु।','Mä juon teetä aamul.'],['Mitä teet? – Teen ruokaa.','What are you doing? – I am cooking. (2, tehdä)','के गर्दैछौ? – खाना बनाउँदैछु।','Mitä sä teet? – Mä teen ruokaa.'],
['Menen kauppaan.','I go to the shop. (3)','म पसल जान्छु।','Mä meen kauppaan.'],['Tuletko huomenna?','Are you coming tomorrow? (3)','भोलि आउँछौ?','Tuutsä huomenna?'],['Opiskelen suomea.','I study Finnish. (3)','म फिनिस पढ्छु।','Mä opiskelen suomee.'],
['Haluan kahvia.','I want coffee. (4)','मलाई कफी चाहियो।','Mä haluun kahvii.'],['Osaatko uida?','Can you swim? (4)','पौडी खेल्न जान्दछौ?','Osaatsä uida?'],['Tarvitsen apua.','I need help. (5)','मलाई सहयोग चाहियो।','Mä tarviin apuu.']]},
{t:'tricks',h:'Tricks to remember',items:[['Say the 5 models every morning: puhun, syön, tulen, haluan, tarvitsen.','हरेक बिहान ५ नमुना भन्नुहोस्।'],['If you hear "-tse-" inside a verb, it is type 5: tarvitsen.','"-tse-" सुनियो भने प्रकार ५।'],['Spoken Finnish shortens type 4: haluan → {{haluun}}, osaan → {{osaan}}.','बोलीमा: {{mä haluun}}।'],['The negative always uses the minä stem without -n: en puhu, en syö, en tule, en halua.','नकारात्मकमा minä रूपबाट -n हटाउनुहोस्।']]},
{t:'check',h:'Which type? What is the minä form?',items:[['juoda','type 2 · juon'],['mennä','type 3 · menen'],['tavata','type 4 · tapaan'],['lukea','type 1 · luen'],['tarvita','type 5 · tarvitsen'],['pelata','type 4 · pelaan'],['kävellä','type 3 · kävelen'],['ostaa','type 1 · ostan'],['nähdä','type 2 · näen (hän näkee)'],['siivota','type 4 · siivoan']]}
]},

{id:'neg',lvl:'A1.1',e:'🚫',fi:'Kieltolause',en:'Saying "not": the negative verb',ne:'नकारात्मक वाक्य',
intro:['In Finnish, "not" is a verb that changes for each person: en, et, ei, emme, ette, eivät. The main verb loses its ending.','फिनिसमा "होइन/छैन" पनि क्रिया हो र पुरुष अनुसार बदलिन्छ: en, et, ei…'],
blocks:[
{t:'table',h:'en, et, ei …',cols:['Person','Not','Example','Spoken','Nepali'],rows:[
['minä','**en**','[[en puhu]]','{{mä en puhu}}','म बोल्दिनँ'],['sinä','**et**','[[et puhu]]','{{sä et puhu}}','तिमी बोल्दैनौ'],['hän','**ei**','[[ei puhu]]','{{se ei puhu}}','ऊ बोल्दैन'],['me','**emme**','[[emme puhu]]','{{me ei puhuta}}','हामी बोल्दैनौं'],['te','**ette**','[[ette puhu]]','{{te ette puhu}}','तिमीहरू बोल्दैनौ'],['he','**eivät**','[[eivät puhu]]','{{ne ei puhu}}','उनीहरू बोल्दैनन्']]},
{t:'steps',h:'Make any verb negative in 3 steps',items:[['Take the minä form: [[puhun]], [[tulen]], [[syön]], [[nukun]].','minä रूप लिनुहोस्।'],['Remove the -n: [[puhu]], [[tule]], [[syö]], [[nuku]].','अन्तिम -n हटाउनुहोस्।'],['Put en / et / ei / emme / ette / eivät in front: [[hän ei nuku]].','अगाडि en / et / ei… राख्नुहोस्।']]},
{t:'rule',h:'Watch out: the weak consonant stays',en:'Because the negative uses the minä stem, it keeps the weak form even for hän: [[hän nukkuu]] → [[hän ei ==nuku==]], [[hän ottaa]] → [[hän ei ==ota==]]. Saying "ei nukku" is a very common mistake.',ne:'hän को लागि पनि कमजोर रूप: [[hän ei nuku]] (nukku होइन)।'},
{t:'rule',h:'"No" as an answer',en:'Answer a yes/no question with the negative verb, alone or with the main verb: [[Tuletko?]] – [[En.]] / [[En tule.]] Plain [[Ei]] works for questions with [[on]]: [[Onko sinulla autoa?]] – [[Ei ole.]]',ne:'"होइन" भन्न नकारात्मक क्रिया: [[Tuletko? – En tule.]]'},
{t:'rule',h:'Negative turns the object into the partitive',en:'[[Juon kahvin.]] → [[En juo ==kahvia==.]] [[Minulla on auto.]] → [[Minulla ei ole ==autoa==.]] [[Täällä on kauppa.]] → [[Täällä ei ole ==kauppaa==.]]',ne:'नकारात्मकमा कर्म partitive हुन्छ: [[Minulla ei ole autoa.]]'},
{t:'ex',h:'Everyday negative sentences',items:[
['En ymmärrä.','I don\'t understand.','मैले बुझिनँ।','Mä en ymmärrä.'],['En tiedä.','I don\'t know.','मलाई थाहा छैन।','En tiiä.'],['En puhu ruotsia.','I don\'t speak Swedish.','म स्विडिस बोल्दिनँ।','Mä en puhu ruotsii.'],['Hän ei ole kotona.','He is not at home.','ऊ घरमा छैन।','Se ei oo kotona.'],
['Emme asu Helsingissä.','We don\'t live in Helsinki.','हामी हेल्सिंकीमा बस्दैनौं।','Me ei asuta Helsingissä.'],['Bussi ei tule.','The bus is not coming.','बस आउँदैन।','Bussi ei tuu.'],['Minulla ei ole aikaa.','I don\'t have time.','मसँग समय छैन।','Mulla ei oo aikaa.'],
['He eivät syö lihaa.','They don\'t eat meat.','उनीहरू मासु खाँदैनन्।','Ne ei syö lihaa.'],['Et ole yksin.','You are not alone.','तिमी एक्लो छैनौ।','Sä et oo yksin.'],['Ei se mitään.','It doesn\'t matter.','केही छैन।','Ei se mitään.']]},
{t:'check',h:'Make it negative',items:[['Puhun ruotsia.','En puhu ruotsia.'],['Hän nukkuu.','Hän ei nuku.'],['He tulevat.','He eivät tule.'],['Minulla on auto.','Minulla ei ole autoa.'],['Me syömme lihaa.','Emme syö lihaa.'],['Sinä ymmärrät.','Et ymmärrä.'],['Juon kahvia.','En juo kahvia.']]}
]},

{id:'kpt',lvl:'A1.1',e:'🔀',fi:'Astevaihtelu (KPT)',en:'KPT: strong and weak consonants',ne:'KPT: बलियो र कमजोर व्यञ्जन',
intro:['k, p and t in the middle of a word switch between a strong and a weak form. English does it a little: knife → knives. Finnish does it everywhere: kauppa → kaupassa.','शब्दको बीचको k, p, t कहिले बलियो कहिले कमजोर हुन्छ। नेपालीमा यस्तो नियम छैन, त्यसैले नयाँ नियम मानेर सिक्नुहोस्।'],
blocks:[
{t:'table',h:'The pairs',cols:['Strong','Weak','Noun','Verb'],rows:[['kk','k','[[kukka → kukat]]','[[nukkua → nukun]]'],['pp','p','[[kauppa → kaupassa]]','[[oppia → opin]]'],['tt','t','[[tyttö → tytön]]','[[ottaa → otan]]'],['k','–','[[ruoka → ruoan]]','[[lukea → luen]]'],['p','v','[[leipä → leivän]]','[[sopia → sovin]]'],['t','d','[[katu → kadulla]]','[[tietää → tiedän]]'],['nk','ng','[[Helsinki → Helsingissä]]','–'],['mp','mm','[[lampi → lammessa]]','–'],['lt','ll','[[ilta → illalla]]','[[kieltää → kiellän]]'],['nt','nn','[[ranta → rannalla]]','[[antaa → annan]]'],['rt','rr','[[kerta → kerran]]','[[kertoa → kerron]]'],['ht','hd','[[lahti → lahden]]','[[lähteä → lähden]]']]},
{t:'rule',h:'The one rule: a closed syllable makes it weak',en:'Split the word into syllables. If an ending makes the last syllable end in a consonant (closed), use the weak form. [[kaup·pa]] (open, strong) → [[kau·pa==n==]] (closed, weak) → [[kau·pas·sa]] (weak).',ne:'अन्त्यले अक्षरलाई व्यञ्जनमा टुंग्याए (बन्द भए) कमजोर: [[kaupan]], [[kaupassa]]।'},
{t:'table',h:'Which forms are weak and which strong?',cols:['Weak (soft)','Strong'],rows:[['genitive [[kaupan]]','basic form [[kauppa]]'],['-ssa -sta -lla -lta -lle: [[kaupassa]]','partitive [[kauppaa]]'],['plural -t: [[kaupat]]','illative [[kauppaan]]'],['verb: minä, sinä, me, te: [[nukun]]','verb: hän, he: [[nukkuu, nukkuvat]]'],['all negatives: [[en nuku, ei nuku]]','essive -na: [[kauppana]]']]},
{t:'rule',h:'Reverse KPT (verb types 3 and 4, and some nouns)',en:'Here the dictionary form is weak and the forms you use are strong: [[tavata → tapaan]] (v → p), [[ajatella → ajattelen]] (t → tt), [[kuunnella → kuuntelen]] (nn → nt), [[pelätä → pelkään]], nouns [[hammas → hampaat]], [[sade → sateen]].',ne:'प्रकार ३–४ मा उल्टो: [[tavata → tapaan]]।'},
{t:'ex',h:'KPT in sentences',items:[['Ostan leivän kaupasta.','I buy the bread from the shop.','म पसलबाट रोटी किन्छु।','Mä ostan leivän kaupast.'],['Asun Helsingissä.','I live in Helsinki.','म हेल्सिंकीमा बस्छु।','Mä asun Helsingis.'],['Illalla nukun hyvin.','In the evening I sleep well.','बेलुका म राम्रोसँग सुत्छु।','Illal mä nukun hyvin.'],['Hän nukkuu sohvalla.','He sleeps on the sofa.','ऊ सोफामा सुत्छ।','Se nukkuu sohval.'],['Tapaan sinut huomenna.','I will meet you tomorrow.','म भोलि तिमीलाई भेट्छु।','Mä tapaan sut huomenna.'],['Annan kirjan äidille.','I give the book to Mother.','म आमालाई किताब दिन्छु।','Mä annan kirjan äidille.']]},
{t:'tricks',h:'Tricks to remember',items:[['Chant: "Minä, sinä, me, te go soft. Hän and he stay strong."','"म, तिमी, हामी, तिमीहरू = नरम। ऊ, उनीहरू = कडा।"'],['Partitive and illative never go weak: kauppaa, kauppaan.','partitive र illative कहिल्यै कमजोर हुँदैनन्।'],['When you learn a noun, learn its genitive too: kauppa, kaupan. The genitive shows the weak form.','नाम सिक्दा genitive पनि सिक्नुहोस्।'],['Hold the double letter: tapan (kill) vs tapaan (meet)!','दोहोरो अक्षर ध्यान दिनुहोस्।']]},
{t:'check',h:'Strong or weak?',items:[['kauppa + ssa','kaupassa'],['pöytä + llä','pöydällä'],['nukkua: minä','nukun'],['nukkua: hän','nukkuu'],['katu + lla','kadulla'],['tavata: minä','tapaan'],['ottaa: hän ei …','ei ota'],['Helsinki + ssä','Helsingissä']]}
]},

{id:'order',lvl:'A1.1',e:'🧩',fi:'Lauseen rakenne',en:'Word order and "there is" sentences',ne:'वाक्यको क्रम',
intro:['Basic Finnish order is like English: who · does · what. "There is" sentences put the place first, exactly like Nepali.','आधारभूत क्रम अंग्रेजी जस्तै: को · गर्छ · के। "… मा … छ" वाक्य नेपाली जस्तै सुरु हुन्छ।'],
blocks:[
{t:'table',h:'Three basic patterns',cols:['Pattern','Finnish','English','Nepali'],rows:[['who · does · what','[[Ram juo kahvia.]]','Ram drinks coffee.','राम कफी पिउँछ।'],['who · is · what / where','[[Kirja on pöydällä.]]','The book is on the table.','किताब टेबलमाथि छ।'],['place · is · something','[[Pöydällä on kirja.]]','There is a book on the table.','टेबलमाथि किताब छ।']]},
{t:'rule',h:'"There is" = place first',en:'Start with the place, then [[on]], then the thing: [[Huoneessa on sänky.]] There is a bed in the room. Nepali does the same: कोठामा ओछ्यान छ। Mass words go partitive: [[Jääkaapissa on maitoa.]] Plural "some" too: [[Puistossa on lapsia.]]',ne:'ठाउँ पहिले: [[Huoneessa on sänky.]] = कोठामा ओछ्यान छ।'},
{t:'rule',h:'Question words come first',en:'[[Missä sinä asut?]] [[Mitä sinä teet?]] The rest keeps normal order. Yes/no questions start with the verb + -ko/-kö: [[Asutko sinä Turussa?]]',ne:'प्रश्नवाचक शब्द सुरुमा।'},
{t:'ex',h:'Examples',items:[['Kaupassa on paljon ihmisiä.','There are many people in the shop.','पसलमा धेरै मानिस छन्।','Kaupas on paljon ihmisii.'],['Onko täällä vessa?','Is there a toilet here?','यहाँ शौचालय छ?','Onks täällä vessaa?'],['Täällä ei ole kauppaa.','There is no shop here.','यहाँ पसल छैन।','Täällä ei oo kauppaa.'],['Kadulla on lunta.','There is snow on the street.','सडकमा हिउँ छ।','Kadul on lunta.'],['Lapset leikkivät pihalla.','The children play in the yard.','बच्चाहरू आँगनमा खेल्छन्।','Lapset leikkii pihal.'],['Huomenna menen kauppaan.','Tomorrow I go to the shop.','भोलि म पसल जान्छु।','Huomenna mä meen kauppaan.']]},
{t:'check',h:'Say it in Finnish',items:[['There is a bed in the room.','Huoneessa on sänky.'],['There is milk in the fridge.','Jääkaapissa on maitoa.'],['The milk is in the fridge.','Maito on jääkaapissa.'],['Is there a shop here?','Onko täällä kauppa(a)?']]}
]},

{id:'partitive',lvl:'A1.2',e:'🍰',fi:'Partitiivi',en:'The partitive: "some", "not any" and after numbers',ne:'पार्टिटिभ: "केही", "अलिकति", संख्यापछि',color:'part',
intro:['The partitive is the most used form in Finnish. It answers Mitä? and usually means "some", "part of" or "not any". Nepali has no ending for it, so think of it as the "some-form". It always ends in -a or -ä.','पार्टिटिभ फिनिसमा सबैभन्दा बढी प्रयोग हुने रूप हो। यो "के?" (Mitä?) को उत्तर हो र प्रायः "केही / अलिकति / कुनै पनि" भन्ने अर्थ दिन्छ। अन्त्य सधैं -a वा -ä।'],
blocks:[
{t:'rule',h:'Spot it: three endings, all end in a/ä',en:'`-a / -ä` · `-ta / -tä` · `-tta / -ttä`. Examples: [[kahvi==a==]], [[maa==ta==]], [[huone==tta==]]. If a form ends in -n, it is not the partitive.',ne:'अन्त्य: `-a`, `-ta`, `-tta`। -n मा टुंगियो भने पार्टिटिभ होइन।'},
{t:'steps',h:'HOW to make it: 5 rules by the word ending',items:[
['**Short vowel at the end** → add a/ä: [[talo → taloa]], [[kahvi → kahvia]], [[kauppa → kauppaa]], [[pöytä → pöytää]].','छोटो स्वरमा टुंगिए → a/ä थप्ने।'],
['**Long vowel or two vowels (short words)** → add ta/tä: [[maa → maata]], [[tee → teetä]], [[työ → työtä]], [[voi → voita]].','लामो स्वर → ta/tä।'],
['**Consonant at the end** → add ta/tä: [[puhelin → puhelinta]], [[mies → miestä]], [[kysymys → kysymystä]], [[avain → avainta]].','व्यञ्जनमा टुंगिए → ta/tä।'],
['**-e at the end** → add tta/ttä: [[huone → huonetta]], [[perhe → perhettä]], [[kirje → kirjettä]].','-e मा टुंगिए → tta/ttä।'],
['**-nen at the end** → -sta/-stä: [[nainen → naista]], [[suomalainen → suomalaista]], [[ihminen → ihmistä]].','-nen → -sta।']]},
{t:'rule',h:'Special group: old words ending in -i',en:'Some old -i words change their stem: [[vesi → vettä]], [[käsi → kättä]], [[kieli → kieltä]], [[lapsi → lasta]], [[uusi → uutta]], [[vuosi → vuotta]], [[nimi → nimeä]], [[järvi → järveä]]. New -i words just add a: [[bussi → bussia]], [[banaani → banaania]].',ne:'पुराना -i शब्द फरक हुन्छन्: [[vesi → vettä]]। नयाँ शब्दमा a मात्र: [[bussi → bussia]]।'},
{t:'rule',h:'No KPT in the partitive',en:'The partitive always keeps the strong consonant: [[kauppaa]] (not kaupaa), [[pöytää]], [[kenkää]], [[leipää]].',ne:'पार्टिटिभमा सधैं बलियो व्यञ्जन: [[kauppaa]]।'},
{t:'forms',h:'Partitive of common words',col:'part',n:40},
{t:'cards',h:'WHEN to use it: 8 situations',items:[
['1 · After numbers 2, 3, 4 …','The thing after any number except 1 goes partitive.','१ बाहेक जुनसुकै संख्यापछि।',['kaksi kahvia','kolme euroa','viisi vuotta','yksi kahvi (1 = no change)']],
['2 · "Some" of a mass thing','Things you cannot count: water, coffee, rice, money, time.','गन्न नसकिने कुरा: पानी, कफी, चामल।',['Juon vettä.','Ostan maitoa.','Syön riisiä.']],
['3 · Negative sentences','With en/et/ei the object goes partitive.','नकारात्मक वाक्यमा।',['En juo kahvia.','Minulla ei ole autoa.','Täällä ei ole bussia.']],
['4 · After amount words','paljon, vähän, kilo, litra, kuppi, lasi, pala, pullo.','मात्रा जनाउने शब्दपछि।',['paljon rahaa','kuppi kahvia','lasi vettä','vähän aikaa']],
['5 · Partitive verbs','Some verbs always take it: rakastaa, odottaa, auttaa, kuunnella, opiskella, harrastaa, etsiä, ajatella.','केही क्रियापछि सधैं।',['Rakastan sinua.','Odotan bussia.','Opiskelen suomea.']],
['6 · Action not finished','Ongoing, "am doing": Luen kirjaa (reading). Finished: Luen kirjan (will read it all).','काम चलिरहेको बेला।',['Luen kirjaa.','Katson televisiota.','Syön omenaa.']],
['7 · Describing mass things','Uncountable subject + adjective: the adjective goes partitive.','गन्न नसकिने कुराको विशेषण।',['Kahvi on hyvää.','Vesi on kylmää.','Ruoka on herkullista.']],
['8 · Mitä? and "there is some"','Mitä? is the partitive of mikä. Answer in the partitive.','Mitä? को उत्तर पार्टिटिभमा।',['Mitä juot? – Teetä.','Kaupassa on maitoa.','Onko sinulla rahaa?']]]},
{t:'table',h:'Pronouns in the partitive',cols:['Basic','Partitive','Spoken','Example','Nepali'],rows:[['minä','[[minua]]','{{mua}}','[[Auta minua!]]','मलाई सहयोग गर!'],['sinä','[[sinua]]','{{sua}}','[[Rakastan sinua.]]','म तिमीलाई माया गर्छु।'],['hän','[[häntä]]','{{sitä}}','[[Odotan häntä.]]','म उसलाई पर्खन्छु।'],['me','[[meitä]]','{{meitä}}','[[Auttakaa meitä!]]','हामीलाई सहयोग गर्नुहोस्!'],['te','[[teitä]]','{{teitä}}','[[Kiitän teitä.]]','तपाईंलाई धन्यवाद।'],['he','[[heitä]]','{{niitä}}','[[Odotamme heitä.]]','हामी उनीहरूलाई पर्खन्छौं।']]},
{t:'table',h:'Basic form or partitive? Compare',cols:['Basic / whole','Partitive','Why'],rows:[['[[yksi kahvi]]','[[kaksi kahvia]]','number 2+'],['[[Kahvi on pöydällä.]] (the coffee)','[[Pöydällä on kahvia.]] (some coffee)','"some"'],['[[Minulla on kissa.]]','[[Minulla ei ole kissaa.]]','negative'],['[[Ostan omenan.]] (one apple)','[[Ostan omenoita.]] (some apples)','some, plural'],['[[Auto on hyvä.]] (countable)','[[Kahvi on hyvää.]] (mass)','mass word'],['[[Luen kirjan.]] (all of it)','[[Luen kirjaa.]] (I am reading)','not finished']]},
{t:'ex',h:'25 example sentences',items:[
['Kaksi kahvia, kiitos.','Two coffees, please.','दुई कफी, धन्यवाद।','Kaks kahvii, kiitos.'],['Juon vettä joka päivä.','I drink water every day.','म हरेक दिन पानी पिउँछु।','Mä juon vettä joka päivä.'],['Ostan leipää ja maitoa.','I buy bread and milk.','म रोटी र दूध किन्छु।','Mä ostan leipää ja maitoo.'],['Minulla ei ole autoa.','I don\'t have a car.','मसँग कार छैन।','Mul ei oo autoo.'],
['Se maksaa viisi euroa.','It costs five euros.','यो पाँच युरो पर्छ।','Se maksaa viis euroo.'],['Olen asunut Suomessa kaksi vuotta.','I have lived in Finland for two years.','म दुई वर्षदेखि फिनल्यान्डमा बस्दैछु।','Mä oon asunu Suomes kaks vuotta.'],['Odotan bussia.','I am waiting for the bus.','म बस पर्खिरहेको छु।','Mä ootan bussii.'],['Rakastan sinua.','I love you.','म तिमीलाई माया गर्छु।','Mä rakastan sua.'],
['Opiskelen suomea.','I study Finnish.','म फिनिस पढ्छु।','Mä opiskelen suomee.'],['Puhutko englantia?','Do you speak English?','अंग्रेजी बोल्नुहुन्छ?','Puhutsä englantii?'],['Haluatko teetä?','Do you want tea?','चिया खानुहुन्छ?','Haluutsä teetä?'],['Mitä sinä syöt? – Riisiä ja kanaa.','What are you eating? – Rice and chicken.','के खाँदैछौ? – भात र कुखुरा।','Mitä sä syöt? – Riisii ja kanaa.'],
['Kahvi on kuumaa.','The coffee is hot.','कफी तातो छ।','Kahvi on kuumaa.'],['Jääkaapissa ei ole maitoa.','There is no milk in the fridge.','फ्रिजमा दूध छैन।','Jääkaapis ei oo maitoo.'],['Onko sinulla rahaa?','Do you have (any) money?','तिमीसँग पैसा छ?','Onks sul rahaa?'],['Minulla on paljon työtä.','I have a lot of work.','मसँग धेरै काम छ।','Mul on paljon duunii.'],
['Saisinko lasin vettä?','Could I have a glass of water?','एक गिलास पानी पाउँ?','Saisinks mä lasin vettä?'],['Kilo perunoita maksaa euron.','A kilo of potatoes costs one euro.','एक किलो आलु एक युरो पर्छ।','Kilo perunoit maksaa euron.'],['Autan äitiä keittiössä.','I help Mother in the kitchen.','म भान्सामा आमालाई सहयोग गर्छु।','Mä autan äitii keittiös.'],['Kuuntelen musiikkia.','I listen to music.','म संगीत सुन्छु।','Mä kuuntelen musiikkii.'],
['Harrastan jalkapalloa.','My hobby is football.','मेरो रुचि फुटबल हो।','Mä harrastan futista.'],['Hän etsii avainta.','He is looking for the key.','ऊ साँचो खोज्दैछ।','Se etsii avainta.'],['En syö lihaa.','I don\'t eat meat.','म मासु खाँदिनँ।','Mä en syö lihaa.'],['Tänään on kylmä. Ulkona on kymmenen astetta pakkasta.','It is cold today. It is minus ten outside.','आज जाडो छ। बाहिर माइनस दस डिग्री छ।','Tänään on kylmä. Ulkon on kymmenen astetta pakkasta.'],
['Pöydällä on kaksi kirjaa.','There are two books on the table.','टेबलमा दुईवटा किताब छन्।','Pöydäl on kaks kirjaa.']]},
{t:'tricks',h:'Tricks to remember',items:[
['Ask yourself: can I say "some" or "any" in English? Then use the partitive.','अंग्रेजीमा "some/any" राख्न मिल्छ भने पार्टिटिभ।'],
['Number 2 or more → partitive. Always. "Kaksi kahvia" is the first phrase to learn.','२ वा बढी → पार्टिटिभ, सधैं।'],
['See "ei" / "en" in the sentence? → the object is partitive.','वाक्यमा ei/en छ भने पार्टिटिभ।'],
['The partitive always ends in a or ä. The genitive ends in n.','पार्टिटिभ = a/ä मा अन्त्य। genitive = n मा।'],
['The question Mitä? is itself a partitive. Mitä juot? → Kahvia.','Mitä? आफैं पार्टिटिभ हो।'],
['Learn verbs with a partitive word attached, as one chunk: "odottaa bussia", "rakastaa sinua", "auttaa äitiä".','क्रियालाई पार्टिटिभसहित एउटै टुक्रा बनाएर सिक्नुहोस्।'],
['Spoken -aa / -ää often becomes {{-oo}}: maitoa → {{maitoo}}, euroa → {{euroo}}, kahvia → {{kahvii}}.','बोलीमा: {{kahvii}}, {{euroo}}।']]},
{t:'check',h:'Make the partitive',items:[['kaksi (kahvi)','kaksi kahvia'],['Juon (vesi)','Juon vettä.'],['Minulla ei ole (auto)','Minulla ei ole autoa.'],['Ostan (leipä)','Ostan leipää.'],['kolme (huone)','kolme huonetta'],['Rakastan (sinä)','Rakastan sinua.'],['paljon (raha)','paljon rahaa'],['viisi (euro)','viisi euroa'],['Opiskelen (suomi)','Opiskelen suomea.'],['Täällä ei ole (kauppa)','Täällä ei ole kauppaa.'],['kaksi (nainen)','kaksi naista'],['Odotan (juna)','Odotan junaa.']]}
]},

{id:'genitive',lvl:'A1.2',e:'🔑',fi:'Genetiivi',en:'The genitive -n: "of", owner, and the key to other forms',ne:'जेनिटिभ: -को',color:'gen',
intro:['The genitive ending -n is the Nepali -को: [[Ramin auto]] = रामको गाडी. It is also the key form: take away the -n and you have the stem for -ssa, -sta, -lla and more.','-n = नेपालीको -को। genitive बाट -n हटाएपछि अरू धेरै रूप बनाउने मूल (stem) पाइन्छ।'],
blocks:[
{t:'steps',h:'HOW to make it',items:[
['**Vowel at the end** → add -n, with weak KPT: [[talo → talon]], [[kauppa → kaupan]], [[pöytä → pöydän]], [[Turku → Turun]], [[Helsinki → Helsingin]].','स्वरमा टुंगिए → -n (KPT कमजोर)।'],
['**-e at the end** → -een: [[huone → huoneen]], [[perhe → perheen]], [[kirje → kirjeen]].','-e → -een।'],
['**-nen** → -sen: [[nainen → naisen]], [[suomalainen → suomalaisen]].','-nen → -sen।'],
['**Old -i words** → -en: [[kieli → kielen]], [[vesi → veden]], [[käsi → käden]], [[lapsi → lapsen]], [[nimi → nimen]], [[vuosi → vuoden]].','पुराना -i शब्द → -en।'],
['**Consonant at the end** → new stem + n: [[puhelin → puhelimen]], [[avain → avaimen]], [[kysymys → kysymyksen]], [[mies → miehen]], [[kevät → kevään]].','व्यञ्जनमा टुंगिए → नयाँ stem + n।']]},
{t:'table',h:'Pronouns: my, your …',cols:['Written','Spoken','English','Nepali'],rows:[['[[minun]]','{{mun}}','my','मेरो'],['[[sinun]]','{{sun}}','your','तिम्रो'],['[[hänen]]','{{sen}}','his / her','उसको'],['[[meidän]]','{{meiän}}','our','हाम्रो'],['[[teidän]]','{{teiän}}','your (pl.)','तिमीहरूको / तपाईंको'],['[[heidän]]','{{niiden}}','their','उनीहरूको']]},
{t:'cards',h:'WHEN to use it',items:[
['1 · Owner (Kenen?)','Whose? Name + n.','कसको? नाम + n।',['Ramin auto','äidin puhelin','Kenen laukku tämä on?']],
['2 · "Of"','Part of something, place names.','"को" सम्बन्ध।',['Suomen pääkaupunki','Turun yliopisto','kahvin hinta']],
['3 · With place words','Genitive + edessä, takana, vieressä, alla, päällä, lähellä, kanssa.','स्थान जनाउने शब्दसँग।',['talon edessä','pöydän alla','ystävän kanssa']],
['4 · Base for other forms','Remove -n → add -ssa, -sta, -lla, -lta, -lle.','-n हटाएर अरू अन्त्य।',['kaupan → kaupassa','pöydän → pöydällä','Turun → Turussa']],
['5 · Whole object (A1.3)','A finished action on one whole thing.','पूरै कुरामा भएको काम।',['Ostan auton.','Luen kirjan.','Syön omenan.']],
['6 · "I must"','Minun täytyy / Minun pitää + verb.','"मैले … पर्छ"।',['Minun täytyy mennä.','Mun pitää lähtee.']]]},

{id:'local',lvl:'A1.2',e:'📍',fi:'Missä? Mistä? Mihin?',en:'The six location cases',ne:'स्थान जनाउने ६ रूप',color:'loc',
intro:['Two sets of three. The "box" set is for inside a space (house, city, shop). The "table" set is for surfaces, open places and people. Each set answers: where at, where from, where to.','दुई समूह, हरेकमा तीन। "बाकस" समूह भित्रको लागि, "टेबल" समूह सतह, खुला ठाउँ र मानिसको लागि।'],
blocks:[
{t:'table',h:'The whole system on one page',cols:['','Missä? (at)','Mistä? (from)','Mihin? (to)'],rows:[
['**Box** · inside','`-ssa/-ssä` [[talossa]]','`-sta/-stä` [[talosta]]','`-Vn` [[taloon]]'],
['**Table** · on, at, person','`-lla/-llä` [[torilla]]','`-lta/-ltä` [[torilta]]','`-lle` [[torille]]'],
['Nepali','-मा','-बाट','-मा / -तिर / -लाई']]},
{t:'rule',h:'Which set?',en:'Buildings, rooms, cities and countries usually take the **box**: [[Turussa]], [[Suomessa]], [[kaupassa]], [[koulussa]]. Open places, surfaces and events take the **table**: [[torilla]], [[asemalla]], [[kadulla]], [[pihalla]], [[rannalla]], [[lentokentällä]], [[kurssilla]], [[kuntosalilla]], [[mökillä]], [[lomalla]]. Some towns use the table too: [[Tampereella]], [[Vantaalla]].',ne:'भवन, कोठा, शहर, देश = बाकस। खुला ठाउँ, सतह, कार्यक्रम = टेबल।'},
{t:'table',h:'Special place words (learn as words)',cols:['Missä?','Mistä?','Mihin?','Meaning'],rows:[['[[kotona]]','[[kotoa]]','[[kotiin]]','at / from / to home'],['[[töissä]]','[[töistä]]','[[töihin]]','at / from / to work'],['[[ulkona]]','[[ulkoa]]','[[ulos]]','outside / out'],['[[sisällä]]','[[sisältä]]','[[sisään]]','inside / in'],['[[täällä]]','[[täältä]]','[[tänne]]','here'],['[[siellä]]','[[sieltä]]','[[sinne]]','there'],['[[tuolla]]','[[tuolta]]','[[tuonne]]','over there'],['[[missä]]','[[mistä]]','[[mihin / minne]]','where']]},
{t:'rule',h:'The verb decides the direction',en:'Verbs of being use Missä: [[asua]], [[olla]], [[odottaa]]. Verbs of moving use Mihin / Mistä: [[mennä]], [[tulla]], [[lähteä]], [[muuttaa]]. Finnish also thinks in movement where English does not: [[Ostan maitoa kaupasta]] (buy FROM the shop), [[Unohdin avaimet kotiin]] (forgot the keys INTO home), [[Jään pois bussista]] (get off the bus).',ne:'बस्ने क्रिया = Missä। जाने/आउने क्रिया = Mihin/Mistä। [[Ostan kaupasta]] = पसलबाट किन्छु।'},
{t:'ex',h:'Examples',items:[['Asun Turussa, mutta olen kotoisin Nepalista.','I live in Turku, but I am from Nepal.','म टुर्कुमा बस्छु, तर नेपालबाट हुँ।','Mä asun Turussa, mut mä oon Nepalist.'],['Menen kauppaan ja sitten kotiin.','I go to the shop and then home.','म पसल र त्यसपछि घर जान्छु।','Mä meen kauppaan ja sit kotiin.'],['Tulen töistä kello viisi.','I come from work at five.','म पाँच बजे कामबाट आउँछु।','Mä tuun duunist viideltä.'],['Odotan asemalla.','I am waiting at the station.','म स्टेसनमा पर्खिरहेको छु।','Mä ootan asemal.'],
['Juna lähtee asemalta.','The train leaves from the station.','रेल स्टेसनबाट छुट्छ।','Juna lähtee asemalt.'],['Menen torille.','I go to the market square.','म बजार चोक जान्छु।','Mä meen torille.'],['Laitan kirjan pöydälle.','I put the book on the table.','म किताब टेबलमाथि राख्छु।','Mä laitan kirjan pöydälle.'],['Otan kirjan pöydältä.','I take the book from the table.','म टेबलबाट किताब लिन्छु।','Mä otan kirjan pöydält.'],
['Ostin maitoa kaupasta.','I bought milk at the shop.','मैले पसलबाट दूध किनेँ।','Mä ostin maitoo kaupast.'],['Lapset leikkivät ulkona.','The children play outside.','बच्चाहरू बाहिर खेल्छन्।','Lapset leikkii ulkona.'],['Tule sisään!','Come in!','भित्र आऊ!','Tuu sisään!'],['Mihin sinä menet? – Kotiin.','Where are you going? – Home.','कहाँ जाँदैछौ? – घर।','Mihin sä meet? – Kotiin.']]},
{t:'tricks',h:'Tricks to remember',items:[['s = inside (sisä), l = on the surface (lattia, floor).','s = भित्र, l = सतहमा।'],['Missä, Mistä, Mihin have the same endings as the answer: miSSÄ → taloSSA.','प्रश्नको अन्त्य = उत्तरको अन्त्य।'],['"To" in Finnish always ends in -n or -lle: kauppaan, kotiin, torille, äidille.','"तर्फ" = -n वा -lle।'],['Spoken Finnish (Helsinki) often drops the final a: {{Turussa → Turus}}, {{kaupasta → kaupast}}, {{asemalla → asemal}}.','बोलीमा अन्तिम a हराउँछ: {{kaupast}}।']]},
{t:'check',h:'Which form?',items:[['I live in (Helsinki).','Asun Helsingissä.'],['I come from (Nepal).','Olen Nepalista.'],['I go to (koulu).','Menen kouluun.'],['I wait at the (asema).','Odotan asemalla.'],['I go to the (tori).','Menen torille.'],['I come from (työ).','Tulen töistä.'],['I am at (koti).','Olen kotona.'],['Put the cup on the (pöytä).','Laita kuppi pöydälle.']]}
]},

{id:'illative',lvl:'A1.2',e:'➡️',fi:'Mihin? Illatiivi',en:'"Into, to": how to build the illative',ne:'"भित्र / तर्फ" रूप कसरी बनाउने',color:'loc',
intro:['The illative ("into, to") has the most different shapes, but there are only four patterns. It always uses the strong consonant.','illative ("भित्र जाने") का चारवटा ढाँचा छन्। यसमा सधैं बलियो व्यञ्जन हुन्छ।'],
blocks:[
{t:'steps',h:'4 patterns',items:[
['**Short vowel at the end** → repeat that vowel + n: [[talo → taloon]], [[kauppa → kauppaan]], [[koulu → kouluun]], [[Helsinki → Helsinkiin]], [[Nepal → Nepaliin]].','अन्तिम स्वर दोहोर्‍याएर n: [[taloon]]।'],
['**One-syllable word with a long vowel** → h + vowel + n: [[maa → maahan]], [[tee → teehen]], [[työ → työhön]], [[yö → yöhön]], [[Lontoo → Lontooseen]] (longer word: -seen).','एक अक्षरे लामो स्वर → h + स्वर + n: [[maahan]]।'],
['**Long vowel in a longer word (often -e words)** → -seen: [[huone → huoneeseen]], [[perhe → perheeseen]], [[kirje → kirjeeseen]], [[kevät → kevääseen]].','लामो शब्द, लामो स्वर → -seen।'],
['**Stem from the genitive + vowel + n** for -nen, old -i and consonant words: [[nainen → naiseen]], [[kieli → kieleen]], [[vesi → veteen]], [[käsi → käteen]], [[puhelin → puhelimeen]].','genitive बाट stem लिएर।']]},
{t:'rule',h:'Strong consonant, always',en:'Like the partitive, the illative keeps the strong grade: [[kauppaan]] (not kaupaan), [[pöytään]], [[Helsinkiin]] (not Helsingiin).',ne:'सधैं बलियो: [[kauppaan]]।'},
{t:'forms',h:'Illative of common words',col:'ill',n:40},
{t:'ex',h:'Examples',items:[['Menen kouluun.','I go to school.','म विद्यालय जान्छु।','Mä meen kouluun.'],['Muutin Suomeen vuonna 2024.','I moved to Finland in 2024.','म २०२४ मा फिनल्यान्ड सरेँ।','Mä muutin Suomeen 2024.'],['Matkustan kesällä Nepaliin.','In summer I travel to Nepal.','गर्मीमा म नेपाल जान्छु।','Mä matkustan kesäl Nepaliin.'],['Laitan maidon jääkaappiin.','I put the milk in the fridge.','म दूध फ्रिजमा राख्छु।','Mä laitan maidon jääkaappiin.'],['Tule huoneeseen!','Come into the room!','कोठाभित्र आऊ!','Tuu huoneeseen!'],['Menen työhön? – Ei: Menen töihin.','To work = töihin (plural!).','काममा = töihin।','Mä meen duuniin.']]},
{t:'check',h:'Make the illative',items:[['kauppa','kauppaan'],['koulu','kouluun'],['Helsinki','Helsinkiin'],['maa','maahan'],['huone','huoneeseen'],['Suomi','Suomeen'],['työ (to work)','töihin'],['koti','kotiin']]}
]}

{id:'chains',lvl:'A1.2',e:'🔗',fi:'Haluan oppia',en:'Verb + verb: want, can, may, must',ne:'क्रिया + क्रिया: चाहनु, सक्नु, पाउनु, पर्नु',

{t:'rule',h:'Must: the owner goes into the genitive',en:'[[Minun täytyy mennä.]] = I must go. The person takes -n and the verb [[täytyy]] never changes: [[Sinun täytyy levätä.]] [[Ramin täytyy tehdä töitä.]] Spoken: {{Mun pitää mennä.}} {{Mun täytyy lähtee.}}',ne:'"मैले जानुपर्छ" = [[Minun täytyy mennä.]] व्यक्ति -n मा।'},

{id:'object',lvl:'A1.3',e:'🎯',fi:'Objekti',en:'The object: partitive, -n or -t?',ne:'कर्म: पार्टिटिभ, -n कि -t?',
intro:['The thing you do something to (the object) has three possible shapes. One flow chart decides it every time.','कर्मका तीन रूप छन्। एउटा क्रमले हरेक पटक निर्णय गर्छ।'],
blocks:[
{t:'steps',h:'Decide in 4 questions',items:[
['Is there a negative (en, ei …)? → **partitive**: [[En osta autoa.]]','नकारात्मक? → पार्टिटिभ।'],
['Is it an amount you cannot count, or "some"? → **partitive**: [[Ostan maitoa.]] [[Ostan omenoita.]]','गन्न नसकिने / केही? → पार्टिटिभ।'],
['Is the verb a partitive verb (rakastaa, odottaa, auttaa, opiskella …) or is the action still going on? → **partitive**: [[Odotan bussia.]] [[Luen kirjaa.]]','पार्टिटिभ क्रिया वा चलिरहेको काम? → पार्टिटिभ।'],
['Otherwise: one whole thing, finished → **-n**: [[Ostan auton.]] [[Syön omenan.]] Several whole things → **-t**: [[Ostan kengät.]]','नत्र: पूरै एउटा → -n; पूरै धेरै → -t।']]},
{t:'table',h:'Compare',cols:['Partitive (some / not / ongoing)','-n / -t (whole, finished)'],rows:[['[[Syön omenaa.]] I am eating an apple.','[[Syön omenan.]] I eat (up) an apple.'],['[[Ostan leipää.]] I buy some bread.','[[Ostan leivän.]] I buy a loaf.'],['[[Luen kirjaa.]] I am reading a book.','[[Luen kirjan.]] I read the book (to the end).'],['[[En osta autoa.]] I don\'t buy a car.','[[Ostan auton.]] I buy a car.'],['[[Ostan kenkiä.]] I buy (some) shoes.','[[Ostan kengät.]] I buy the shoes.']]},
{t:'table',h:'Personal pronoun objects',cols:['Whole (-t)','Partitive','English'],rows:[['[[minut]]','[[minua]]','me'],['[[sinut]]','[[sinua]]','you'],['[[hänet]]','[[häntä]]','him / her'],['[[meidät]]','[[meitä]]','us'],['[[teidät]]','[[teitä]]','you (pl.)'],['[[heidät]]','[[heitä]]','them']]},
{t:'ex',h:'Examples',items:[['Tapaan sinut huomenna.','I will meet you tomorrow.','म भोलि तिमीलाई भेट्छु।','Mä tapaan sut huomenna.'],['Ostin uuden puhelimen.','I bought a new phone.','मैले नयाँ फोन किनेँ।','Mä ostin uuden puhelimen.'],['Juon kupin kahvia.','I drink a cup of coffee.','म एक कप कफी पिउँछु।','Mä juon kupin kahvii.'],['Otan tämän.','I\'ll take this one.','म यो लिन्छु।','Mä otan tän.'],['Katson televisiota.','I am watching TV.','म टिभी हेर्दैछु।','Mä kattelen telkkarii.']]},
{t:'check',h:'Partitive or -n?',items:[['I buy a car (whole).','Ostan auton.'],['I don\'t buy a car.','En osta autoa.'],['I buy (some) milk.','Ostan maitoa.'],['I am waiting for the bus.','Odotan bussia.'],['I eat the apple (all of it).','Syön omenan.']]}
]},

{id:'puhe',lvl:'A1.1',e:'💬',fi:'Puhekieli',en:'Spoken Finnish (puhekieli): the rules',ne:'बोलीचालीको फिनिस',

blocks:[
{t:'rule',h:'Exam tip',en:'**Write** in kirjakieli (minä olen, me menemme). **Speak** as you like, but stay consistent. In the listening test you will hear puhekieli, so learn to recognise it.',ne:'लेखनमा kirjakieli। बोल्दा जुन पनि, तर एउटै शैली। सुन्ने परीक्षामा puhekieli आउँछ।'},
{t:'table',h:'14 rules of spoken Finnish',cols:['Rule','Written','Spoken'],rows:[
['1 · Short pronouns','[[minä, sinä, hän, he]]','{{mä, sä, se, ne}}'],
['2 · olla shortens','[[olen, olet, ei ole]]','{{oon, oot, ei oo}}'],

['4 · they = hän form','[[he puhuvat]]','{{ne puhuu}}'],
['5 · -ko/-kö → -ks / + sä','[[Onko? Voitko? Tuletko?]]','{{Onks? Voiksä? Tuutsä?}}'],
['6 · Numbers shorten','[[yksi, kaksi, viisi, kuusi]]','{{yks, kaks, viis, kuus}}'],
['7 · d disappears or changes','[[kahdeksan, meidän, tiedän]]','{{kaheksan, meiän, tiiän}}'],
['8 · -ea / -eä → -ee','[[vaikea, pimeä, kipeä]]','{{vaikee, pimee, kipee}}'],
['9 · -aa partitive → -oo / -ii','[[kahvia, euroa, maitoa]]','{{kahvii, euroo, maitoo}}'],
['10 · this, that','[[tämä, tuo, nämä, nuo]]','{{tää, toi, nää, noi}}'],

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

const TTS={ok:typeof window!=='undefined'&&'speechSynthesis' in window,voice:null,count:0};
function pickVoice(){try{const vs=speechSynthesis.getVoices();TTS.count=vs.length;TTS.voice=vs.find(v=>/^fi([-_]|$)/i.test(v.lang))||null;voiceNote()}catch(e){}}
function voiceNote(){$$('.voice-note').forEach(n=>{
  if(!TTS.ok){n.hidden=false;n.innerHTML='<span class="lbl">Sound</span>This browser cannot play speech, so the speaker buttons stay silent. Try Chrome, Edge or Safari.';return}
  n.hidden=!(TTS.count&&!TTS.voice);
  n.innerHTML='<span class="lbl">Sound</span>No Finnish voice was found on this device, so words may sound English. Add a Finnish voice in your device\'s speech settings (on Mac and iPhone it is called <b>Satu</b>), then reload.';})}
if(TTS.ok){pickVoice();try{speechSynthesis.addEventListener('voiceschanged',pickVoice)}catch(e){}}
function say(text,onend,rate){
  if(!TTS.ok){onend&&setTimeout(onend,300);return}
  try{const u=new SpeechSynthesisUtterance(String(text).replace(/[–—…]/g,', ').replace(/["“”]/g,'').replace(/(\d+)\.(\d\d)/g,'$1 $2'));
    u.lang='fi-FI';if(TTS.voice)u.voice=TTS.voice;u.rate=rate||($('#optSlow')&&$('#optSlow').checked?0.62:0.9);
    if(onend){let done=false;const f=()=>{if(!done){done=true;onend()}};u.onend=f;u.onerror=f}
    speechSynthesis.speak(u)}catch(e){onend&&onend()}
}
function hush(){try{speechSynthesis.cancel()}catch(e){}}
function sayNow(t){hush();say(t)}

function todayKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function markDay(){const days=sget('days',[]);const k=todayKey();if(!days.includes(k)){days.push(k);sset('days',days.slice(-400))}updateStreak()}
function streakCount(){const days=new Set(sget('days',[]));let d=new Date(),n=0;if(!days.has(todayKey(d)))d.setDate(d.getDate()-1);while(days.has(todayKey(d))){n++;d.setDate(d.getDate()-1)}return n}
function updateStreak(){const n=streakCount();const el=$('#streak');if(el)el.textContent='🔥 '+n+(n===1?' day':' days')}
function countActivity(){const k='act:'+todayKey();const n=sget(k,0)+1;sset(k,n);if(n>=15)markDay()}

function norm(s){return String(s||'').toLowerCase().replace(/[’`´]/g,"'").replace(/[.,!?;:"“”()]/g,' ').replace(/\s+/g,' ').trim().replace(/^kello /,'')}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function checkAns(input,answers){
  const n=norm(input);const list=answers.map(a=>[a,norm(a)]);
  for(const [a,na] of list)if(n===na)return {ok:true,best:a,d:0};
  let best=list[0],bd=1e9;for(const x of list){const d=lev(n,x[1]);if(d<bd){bd=d;best=x}}
  return {ok:false,best:best[0],d:bd,close:bd<=1&&best[1].length>3};
}
// highlight where the correct answer differs from what was typed
function diffHTML(input,target){
  const a=norm(input),t=String(target);const tn=t.toLowerCase();
  const m=a.length,n=tn.length;const D=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++)D[i][0]=i;for(let j=0;j<=n;j++)D[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)D[i][j]=Math.min(D[i-1][j]+1,D[i][j-1]+1,D[i-1][j-1]+(a[i-1]===tn[j-1]?0:1));
  const mark=new Array(n).fill(false);let i=m,j=n;
  while(i>0&&j>0){if(a[i-1]===tn[j-1]&&D[i][j]===D[i-1][j-1]){i--;j--}else if(D[i][j]===D[i-1][j-1]+1){mark[j-1]=true;i--;j--}else if(D[i][j]===D[i][j-1]+1){mark[j-1]=true;j--}else i--}
  while(j>0){mark[j-1]=true;j--}
  return [...t].map((c,k)=>mark[k]&&/\S/.test(c)&&!/[.,!?]/.test(c)?`<span class="dbad">${esc(c)}</span>`:esc(c)).join('');
}

function hlEnd(f,i){let m=null;
  if(i===0)m=f.match(/n$/);else if(i===1)m=f.match(/t$/);else if(i===3)m=f.match(/mme$/);else if(i===4)m=f.match(/tte$/);else if(i===5)m=f.match(/v[aä]t$/);
  else if(f.length>2&&f.slice(-1)===f.slice(-2,-1)&&/[aeiouyäö]/.test(f.slice(-1)))m=[f.slice(-1)];
  if(!m)return esc(f);const k=f.length-m[0].length;return esc(f.slice(0,k))+'<span class="hl">'+esc(m[0])+'</span>'}
const PRN=['minä','sinä','hän','me','te','he'];

function verbMini(v){return `<div class="forms">${[0,3,1,4,2,5].map(i=>`<div><span class="mut">${PRN[i]}</span> <b class="fi">${hlEnd(v.f[i],i)}</b></div>`).join('')}</div>`+(v.k?`<div class="hint">${tag(esc(v.k),'ess')}</div>`:'')}

function nounCards(cat){return NOUNS[cat].items.map(it=>({id:'n|'+cat+'|'+it[1]+'|'+it[2],e:it[0],fi:it[1],en:it[2],ne:it[3],xf:it[4],xe:it[5],xn:it[6],sp:PUHE[it[1]]}))}
function verbCard(v){const p=PAST[v.fi];return {id:'v|'+v.fi,e:v.e,fi:v.fi,en:v.en,ne:v.ne,xf:v.x[0],xe:v.x[1],xn:v.x[2],v,note:p?'Past: minä '+p[0]+', hän '+p[1]:''}}
function qCard(q){return {id:'q|'+q[1],e:q[0],fi:q[1]+'?',en:q[2],ne:q[3],xf:q[5]+' – '+q[8],xe:q[6]+' – '+q[9],xn:q[7]+' – '+q[10]}}

function caseCard(c){return {id:'c|'+c[0],e:'🧱',fi:c[0],en:c[1]+': '+c[3],ne:c[4],xf:c[5][0][0],xe:c[5][0][1],xn:c[5][0][2],note:c[2]!=='—'?'Question: '+c[2]:''}}
function sufCard(s){return {id:'s|'+s[0],e:'🧩',fi:s[0],en:s[1],ne:s[2],xf:s[3].slice(0,2).map(x=>x[0]+' → '+x[2]).join(' · '),xe:s[3].slice(0,2).map(x=>x[1]+' → '+x[3]).join(' · ')}}
function deckCards(id){
  const [t,k]=id.split(':');
